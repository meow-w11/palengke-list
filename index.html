<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a4d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>Palengke List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one screen — tabs (List / Shop), scrolling content, trip total docked at the bottom */
:root{
  --bg:#f3f6f1; --surface:#ffffff; --fg:#17231b; --muted:#5f6f64; --line:#dbe3d8;
  --accent:#1f7a4d; --accent-ink:#ffffff; --soft:#e3efe5; --danger:#b4412f; --warn:#a1620a; --warn-soft:#fbefd9;
  --display:"Familjen Grotesk", "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Roboto Mono", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1712; --surface:#17211a; --fg:#e7efe8; --muted:#93a598; --line:#26332a;
  --accent:#4cc38a; --accent-ink:#06130b; --soft:#1c3226; --danger:#ef7a66; --warn:#f2b45a; --warn-soft:#3a2c14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1712; --surface:#17211a; --fg:#e7efe8; --muted:#93a598; --line:#26332a;
  --accent:#4cc38a; --accent-ink:#06130b; --soft:#1c3226; --danger:#ef7a66; --warn:#f2b45a; --warn-soft:#3a2c14; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);margin:0}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.pad{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
header{padding-block:14px 8px}
h1{font-size:1.35rem;margin:0 0 10px;letter-spacing:-.01em}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.tabs button{padding:9px 0;border-radius:9px;background:none;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
main{flex:1;overflow-y:auto;min-height:0;padding-block:8px 16px}
input{font:inherit;font-size:16px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;width:100%;box-sizing:border-box}
input.num{font-family:var(--mono);text-align:right}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;color:var(--fg)}
.primary{background:var(--accent);color:var(--accent-ink);border-radius:10px;font-weight:700;padding:10px 14px}
.ghost{background:none;color:var(--accent);font-size:.82rem;padding:6px 0;text-decoration:underline}
.danger{color:var(--danger)}
.note{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:8px 12px;margin-top:8px}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:.9rem;line-height:1.5}
.label{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 6px;display:flex;justify-content:space-between;gap:8px}
.label b{font-family:var(--mono);letter-spacing:0;color:var(--fg)}
/* add form */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--fg)}

.hint{font-size:.72rem;color:var(--muted);margin-top:6px}
.form-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
/* master list rows */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li-main{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 12px;width:100%;text-align:left;background:none}
.nm{min-width:0;overflow-wrap:anywhere}
.amt{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:.68rem;background:var(--soft);color:var(--muted);border-radius:6px;padding:2px 6px}
.price{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.price.none{color:var(--muted);font-size:.78rem}
.li.bought .nm{color:var(--muted);text-decoration:line-through}
.edit{padding:0 12px 12px}
/* shop */
.storebar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.storebar::-webkit-scrollbar{display:none}
.store{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:left;min-width:86px}
.store .s-nm{font-weight:700;font-size:.9rem;display:block}
.store .s-left{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.store[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.store[aria-pressed="true"] .s-left{color:var(--accent-ink);opacity:.85}
.store.done:not([aria-pressed="true"]) .s-left{color:var(--accent)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden}
.item-main{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:12px;width:100%;text-align:left;background:none}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:.85rem}
.item.in .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item.in .nm{color:var(--muted);text-decoration:line-through}
.item.other{border-style:dashed}
.est{font-family:var(--mono);font-size:.75rem;color:var(--muted);text-align:right}
.paid{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.editor{display:grid;grid-template-columns:1fr auto;gap:6px;padding:0 12px 12px}
.editor .actions{grid-column:1/-1;display:flex;justify-content:space-between}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.82rem;margin-top:10px;line-height:1.4}
details summary{cursor:pointer;color:var(--muted);font-size:.82rem;margin-top:18px}
footer{background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px}
footer .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
footer .tot{font-family:var(--mono);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums}
footer .right{text-align:right;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.bar{height:6px;background:var(--soft);border-radius:4px;margin-top:6px;width:120px;overflow:hidden;margin-left:auto}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.82rem;margin-top:10px}
.storeedit{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:6px}
</style>
</head>
<body>


<div class="app">
  <header class="pad">
    <h1>Palengke List</h1>
    <div class="tabs" role="tablist">
      <button id="tabList" role="tab" type="button" aria-selected="true">List</button>
      <button id="tabShop" role="tab" type="button" aria-selected="false">Shop</button>
    </div>
  </header>
  <main class="pad" id="main"></main>
  <footer class="pad">
    <div>
      <div class="lbl" id="totLbl">Spent this trip</div>
      <div class="tot" id="total">₱0.00</div>
    </div>
    <div>
      <div class="right" id="prog">0 of 0 items</div>
      <div class="bar"><i id="barFill" style="width:0%"></i></div>
    </div>
  </footer>
</div>

<script>
const peso = n => "₱" + (Math.round(n*100)/100).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const KEY = "palengke-v4";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const DEFAULT_STORES = [{id:"mall",name:"Mall"},{id:"mng",name:"MnG"},{id:"palengke",name:"Palengke"},{id:"korean",name:"Korean store"}];
const SAMPLE = {sample:true, stores:DEFAULT_STORES, items:[
  {id:"a1",name:"Chicken thighs",stores:["mall","mng"],skip:[],bought:{store:"mall",price:198}},
  {id:"a2",name:"Pork belly",stores:["mall","mng"],skip:[],bought:null},
  {id:"a3",name:"Soy sauce",stores:["mall"],skip:[],bought:null},
  {id:"a4",name:"Tofu",stores:["korean","palengke"],skip:[],bought:null},
  {id:"a5",name:"Kangkong",stores:["palengke"],skip:[],bought:null},
  {id:"a6",name:"Gochujang",stores:["korean"],skip:[],bought:null},
  {id:"a7",name:"Garlic",stores:["palengke","mall"],skip:[],bought:null}
]};
let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch(e){ state = null; }
if (!state || !Array.isArray(state.items)) {
  // bring over items from the older dish-based version, if any
  let v3 = null; try { v3 = JSON.parse(localStorage.getItem("palengke-v3")); } catch(e){}
  let old = null; try { old = JSON.parse(localStorage.getItem("palengke-v2")); } catch(e){}
  if (v3 && Array.isArray(v3.items) && !v3.sample && v3.items.length) {
    state = {sample:false, stores:v3.stores, items:v3.items.map(i=>({id:i.id,name:i.name+(i.amt?" ("+i.amt+")":""),stores:i.stores||[],skip:[],bought:i.bought||null}))};
  } else if (old && Array.isArray(old.dishes) && !old.sample && old.dishes.some(d=>d.items.length)) {
    state = {sample:false, stores:structuredClone(DEFAULT_STORES), items: old.dishes.flatMap(d=>d.items.map(i=>({id:i.id,name:i.name+(i.amt?" ("+i.amt+")":""),stores:[],skip:[],bought:null})))};
  } else state = structuredClone(SAMPLE);
}
state.items.forEach(i => { if (!Array.isArray(i.skip)) i.skip = []; });
let ui = {tab:"list", store:null, editing:null, confirming:null, addStores:[], editStores:false};
try { Object.assign(ui, JSON.parse(localStorage.getItem(KEY+"-ui")) || {}); } catch(e){}
ui.editing = null; ui.confirming = null; ui.editStores = false;
if (!state.stores.some(s=>s.id===ui.store)) ui.store = state.stores[0]?.id || null;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); localStorage.setItem(KEY+"-ui", JSON.stringify({tab:ui.tab,store:ui.store,addStores:ui.addStores})); } catch(e){} };
const touch = () => { state.sample = false; save(); };
const $ = id => document.getElementById(id);
const el = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const storeName = id => state.stores.find(s=>s.id===id)?.name || "Removed store";
const options = it => (it.stores.length ? it.stores : state.stores.map(s=>s.id)).filter(s => !it.skip.includes(s));
const canBuyAt = (it, sid) => options(it).includes(sid);
const nowFirst = it => options(it)[0];
const leftAt = sid => state.items.filter(i => !i.bought && canBuyAt(i, sid));

function chipRow(selected, onToggle){
  const row = el(`<div class="chips"></div>`);
  state.stores.forEach(s => {
    const c = el(`<button type="button" class="chip" aria-pressed="${selected.includes(s.id)}"></button>`);
    const paint = () => { const i = selected.indexOf(s.id); c.setAttribute("aria-pressed", i>=0);
      c.textContent = (i>=0 ? (i===0 ? "1st · " : "Backup · ") : "") + s.name; };
    paint();
    c.onclick = () => { onToggle(s.id); row.querySelectorAll(".chip").forEach(x=>x._paint()); };
    c._paint = paint;
    row.appendChild(c);
  });
  return row;
}
function sampleNote(main){
  if (!state.sample) return;
  const n = el(`<div class="note"><span>These are example items.</span><button class="ghost" type="button">Clear examples</button></div>`);
  n.querySelector("button").onclick = () => { state.items = []; state.sample = false; save(); render(); };
  main.appendChild(n);
}

/* ---------- LIST ---------- */
function renderList(main){
  sampleNote(main);
  // add form
  const sel = ui.addStores.filter(id => state.stores.some(s=>s.id===id));
  const f = el(`<form class="card" autocomplete="off">
    <input id="newName" placeholder="What do you need? e.g. Tofu" aria-label="Item name">
    <div class="hint">Where to buy it? Tap your first choice, then any backups.</div>
    <div class="chipslot"></div>
    <div class="form-foot"><span class="hint" style="margin:0">No store picked = any store</span><button class="primary" type="submit">Add to list</button></div>
  </form>`);
  f.querySelector(".chipslot").replaceWith(chipRow(sel, id => {
    const i = sel.indexOf(id); i>=0 ? sel.splice(i,1) : sel.push(id);
    ui.addStores = sel.slice(); save();
  }));
  f.onsubmit = e => { e.preventDefault();
    const name = $("newName").value.trim(); if (!name) return;
    if (state.sample) { state.items = []; }
    state.items.push({id:uid(),name,stores:sel.slice(),skip:[],bought:null});
    touch(); render(); $("newName").focus();
  };
  main.appendChild(f);

  // master list
  const lab = el(`<div class="label"><span>Master list · ${state.items.length} item${state.items.length===1?"":"s"}</span></div>`);
  main.appendChild(lab);
  if (!state.items.length) { main.appendChild(el(`<div class="empty">Add everything you need to buy above. You'll tick them off store by store in Shop.</div>`)); }
  else {
    const rows = el(`<div class="rows"></div>`);
    state.items.forEach(it => {
      const r = el(`<div class="li${it.bought?" bought":""}">
        <button type="button" class="li-main">
          <span class="nm"><span class="t"></span><span class="tags"></span></span>
          <span class="price${it.bought?"":" none"}">${it.bought?peso(it.bought.price):"edit"}</span>
        </button></div>`);
      r.querySelector(".t").textContent = it.name;
      const tags = r.querySelector(".tags");
      (it.stores.length ? it.stores : [null]).forEach((s,i) => { const t = el(`<span class="tag"></span>`); t.textContent = s ? (i ? "or " : "") + storeName(s) : "Any store"; tags.appendChild(t); });
      r.querySelector(".li-main").onclick = () => { ui.editing = ui.editing===it.id ? null : it.id; ui.confirming=null; render(); };
      if (ui.editing === it.id) r.appendChild(itemEditor(it));
      rows.appendChild(r);
    });
    main.appendChild(rows);
  }

  // stores
  const sl = el(`<div class="label"><span>Stores</span></div>`);
  const tg = el(`<button class="ghost" type="button" style="padding:0;font-size:.72rem;letter-spacing:0;text-transform:none">${ui.editStores?"Done":"Edit stores"}</button>`);
  tg.onclick = () => { ui.editStores = !ui.editStores; render(); };
  sl.appendChild(tg); main.appendChild(sl);
  if (ui.editStores) {
    const box = el(`<div class="card" style="margin-top:0"></div>`);
    state.stores.forEach(s => {
      const r = el(`<div class="storeedit"><input aria-label="Store name"><button class="ghost danger" type="button">Remove</button></div>`);
      const inp = r.querySelector("input"); inp.value = s.name;
      inp.onchange = () => { const v = inp.value.trim(); if (v) { s.name = v; touch(); render(); } };
      r.querySelector("button").onclick = () => {
        state.stores = state.stores.filter(x=>x!==s);
        state.items.forEach(i => i.stores = i.stores.filter(x=>x!==s.id));
        if (ui.store===s.id) ui.store = state.stores[0]?.id || null;
        touch(); render(); };
      box.appendChild(r);
    });
    const add = el(`<form class="storeedit" autocomplete="off"><input placeholder="New store, e.g. S&R" aria-label="New store name"><button class="primary" type="submit">Add</button></form>`);
    add.onsubmit = e => { e.preventDefault(); const v = add.querySelector("input").value.trim(); if(!v) return;
      state.stores.push({id:uid(),name:v}); touch(); render(); };
    box.appendChild(add);
    main.appendChild(box);
  } else {
    main.appendChild(el(`<div class="hint" style="margin-top:0">${state.stores.map(s=>esc(s.name)).join(" · ")}</div>`));
  }

  if (state.items.length) {
    const go = el(`<button class="primary" type="button" style="width:100%;margin-top:18px">Go shopping →</button>`);
    go.onclick = () => setTab("shop"); main.appendChild(go);
  }
}

function itemEditor(it){
  const sel = it.stores.slice();
  const ed = el(`<form class="edit" autocomplete="off">
    <input aria-label="Item name">
    <div class="chipslot"></div>
    <div class="form-foot"><button class="ghost danger" type="button" data-a="del">Delete item</button>
      <span style="display:flex;gap:12px;align-items:center"><button class="ghost" type="button" data-a="cancel">Cancel</button><button class="primary" type="submit">Save</button></span></div>
  </form>`);
  const n = ed.querySelector("input");
  n.value = it.name;
  ed.querySelector(".chipslot").replaceWith(chipRow(sel, id => { const i=sel.indexOf(id); i>=0?sel.splice(i,1):sel.push(id); }));
  ed.onsubmit = e => { e.preventDefault(); if (!n.value.trim()) return;
    it.name = n.value.trim(); it.stores = sel;
    ui.editing=null; touch(); render(); };
  ed.querySelector('[data-a="cancel"]').onclick = () => { ui.editing=null; render(); };
  ed.querySelector('[data-a="del"]').onclick = () => { state.items = state.items.filter(x=>x!==it); ui.editing=null; touch(); render(); };
  return ed;
}

/* ---------- SHOP ---------- */
function shopItem(it, sid, kind){
  const inCart = !!it.bought;
  const card = el(`<div class="item${inCart?" in":""}${kind==="other"?" other":""}">
    <button class="item-main" type="button">
      <span class="box">${inCart?"✓":""}</span>
      <span class="nm"><span class="t"></span><span class="tags"></span></span>
      <span class="${inCart?"paid":"est"}">${inCart ? peso(it.bought.price) : "tap to add price"}</span>
    </button></div>`);
  card.querySelector(".t").textContent = it.name;
  if (kind==="here" && nowFirst(it) !== sid) card.querySelector(".tags").appendChild(el(`<span class="tag">backup here</span>`));
  card.querySelector(".item-main").onclick = () => { ui.editing = ui.editing===it.id ? null : it.id; render(); };
  if (ui.editing === it.id) {
    const ed = el(`<form class="editor" autocomplete="off">
      <input class="num" type="number" inputmode="decimal" min="0" step="any" placeholder="Price paid, ₱" aria-label="Price paid for ${esc(it.name)}">
      <button class="primary" type="submit">${inCart?"Update":"In cart"}</button>
      <div class="actions">${inCart?'<button class="ghost danger" type="button" data-a="out">Take out of cart</button>':(kind==="here"?'<button class="ghost danger" type="button" data-a="na">Not available here</button>':'<span></span>')}
      <button class="ghost" type="button" data-a="cancel">Cancel</button></div></form>`);
    const inp = ed.querySelector("input");
    if (inCart) inp.value = it.bought.price;
    ed.onsubmit = e => { e.preventDefault(); const v = parseFloat(inp.value);
      it.bought = {store: inCart ? it.bought.store : sid, price: Number.isFinite(v)?v:0}; ui.editing=null; touch(); render(); };
    ed.querySelector('[data-a="cancel"]').onclick = () => { ui.editing=null; render(); };
    const na = ed.querySelector('[data-a="na"]');
    if (na) na.onclick = () => { if (!it.skip.includes(sid)) it.skip.push(sid); ui.editing=null; touch(); render(); };
    const out = ed.querySelector('[data-a="out"]'); if (out) out.onclick = () => { it.bought=null; ui.editing=null; touch(); render(); };
    card.appendChild(ed);
    setTimeout(()=>inp.focus(),0);
  }
  return card;
}

function renderShop(main){
  sampleNote(main);
  if (!state.items.length) { main.appendChild(el(`<div class="empty">Nothing to buy yet. Add items in List first.</div>`)); return; }
  if (!state.stores.length) { main.appendChild(el(`<div class="empty">Add a store in List → Edit stores.</div>`)); return; }
  const sid = ui.store;
  // store switcher
  const bar = el(`<div class="storebar" role="group" aria-label="Which store are you at?"></div>`);
  state.stores.forEach(s => {
    const n = leftAt(s.id).length;
    const b = el(`<button type="button" class="store${n?"":" done"}" aria-pressed="${s.id===sid}"><span class="s-nm"></span><span class="s-left">${n ? n+" left" : "✓ done"}</span></button>`);
    b.querySelector(".s-nm").textContent = s.name;
    b.onclick = () => { ui.store = s.id; ui.editing=null; save(); render(); main.scrollTop = 0; };
    bar.appendChild(b);
  });
  main.appendChild(bar);

  const here = leftAt(sid);
  const boughtHere = state.items.filter(i => i.bought && i.bought.store===sid);
  const sub = boughtHere.reduce((a,i)=>a+i.bought.price,0);

  main.appendChild(el(`<div class="label"><span>To buy at ${esc(storeName(sid))} · ${here.length}</span></div>`));
  if (!here.length) main.appendChild(el(`<div class="empty" style="padding:12px 8px">Nothing left to buy here.</div>`));
  here.forEach(it => main.appendChild(shopItem(it, sid, "here")));

  if (boughtHere.length) {
    main.appendChild(el(`<div class="label"><span>In cart from ${esc(storeName(sid))} · ${boughtHere.length}</span><b>${peso(sub)}</b></div>`));
    boughtHere.forEach(it => main.appendChild(shopItem(it, sid, "cart")));
  }

  // items from other stores — in case you find them here
  const others = state.items.filter(i => !i.bought && !canBuyAt(i, sid));
  if (others.length) {
    const d = el(`<details><summary>Found something from another store here? (${others.length})</summary></details>`);
    if (ui.openOthers) d.open = true;
    d.ontoggle = () => { ui.openOthers = d.open; };
    others.forEach(it => {
      const c = shopItem(it, sid, "other");
      const where = el(`<span class="tags" style="padding:0 12px 10px 52px"></span>`);
      const opts = options(it);
      if (it.skip.includes(sid)) where.appendChild(el(`<span class="tag">marked not available here</span>`));
      opts.forEach(s => { const t = el(`<span class="tag"></span>`); t.textContent = storeName(s); where.appendChild(t); });
      c.appendChild(where); d.appendChild(c);
    });
    main.appendChild(d);
  }

  // leaving-store reminder: items only available here
  const onlyHere = here.filter(i => { const o = options(i); return o.length===1 && o[0]===sid; });
  if (onlyHere.length && boughtHere.length) {
    main.appendChild(el(`<div class="warnbox">Before you leave ${esc(storeName(sid))}: ${onlyHere.length} item${onlyHere.length===1?" is":"s are"} only on your list for this store (${onlyHere.map(i=>esc(i.name)).join(", ")}).</div>`));
  }

  const stranded = state.items.filter(i => !i.bought && !options(i).length);
  if (stranded.length) main.appendChild(el(`<div class="warnbox">No store left for: ${stranded.map(i=>esc(i.name)).join(", ")}. Add another store to ${stranded.length===1?"it":"them"} in List.</div>`));

  // new trip
  const wrap = el(`<div style="margin-top:22px"></div>`);
  if (ui.confirming === "reset") {
    const c = el(`<div class="confirm"><span>Start a new trip?</span>
      <button class="primary" type="button" data-a="keep">Keep list, clear ticks</button>
      <button class="ghost danger" type="button" data-a="wipe">Clear whole list</button>
      <button class="ghost" type="button" data-a="cancel">Cancel</button></div>`);
    c.querySelector('[data-a="keep"]').onclick = () => { state.items.forEach(i=>{i.bought=null;i.skip=[];}); ui.confirming=null; touch(); render(); };
    c.querySelector('[data-a="wipe"]').onclick = () => { state.items=[]; ui.confirming=null; touch(); setTab("list"); };
    c.querySelector('[data-a="cancel"]').onclick = () => { ui.confirming=null; render(); };
    wrap.appendChild(c);
  } else {
    const b = el(`<button class="ghost" type="button">Start a new trip</button>`);
    b.onclick = () => { ui.confirming="reset"; render(); };
    wrap.appendChild(b);
  }
  main.appendChild(wrap);
}

function render(){
  const main = $("main"); const st = main.scrollTop; main.innerHTML = "";
  $("tabList").setAttribute("aria-selected", ui.tab==="list");
  $("tabShop").setAttribute("aria-selected", ui.tab==="shop");
  (ui.tab==="list" ? renderList : renderShop)(main);
  main.scrollTop = st;
  const items = state.items, got = items.filter(i=>i.bought);
  const spent = got.reduce((a,i)=>a+i.bought.price,0);
  $("total").textContent = peso(spent);
  $("prog").textContent = `${got.length} of ${items.length} items`;
  $("barFill").style.width = items.length ? (got.length/items.length*100)+"%" : "0%";
}
function setTab(t){ ui.tab=t; ui.editing=null; ui.confirming=null; save(); render(); $("main").scrollTop=0; }
$("tabList").onclick = () => setTab("list");
$("tabShop").onclick = () => setTab("shop");
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>

</body>
</html>
