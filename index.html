<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8ad11f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1b20" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>Palengke List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one screen. Home = single start button. During a trip: tabs (List / Shop / Prices), scrolling content, trip total docked at the bottom */
:root{
  --bg:#f1f7ec; --surface:#ffffff; --fg:#102a30; --muted:#56706f; --line:#d5e6cc;
  --accent:#8ad11f; --accent-ink:#10250a; --link:#2e7a0c; --hi:#ffcf1f; --soft:#e4f3d3; --danger:#c0391e; --warn:#8a5a00; --warn-soft:#fff2c9;
  --up:#c2410c; --down:#2e7a0c; --bar:#0f97a8; --bar-hi:#0a6f7c; --grid:#e3eedd;
  --br0:#0a6f7c; --br1:#b4480f; --br2:#6b3fa0; --br3:#1d5fa8; --br4:#a12a6b; --sale:#8a5a00; --sale-soft:#fff2c9;
  --display:"Familjen Grotesk", "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Roboto Mono", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1b20; --surface:#12282e; --fg:#e9f6e2; --muted:#8eaaa6; --line:#21414a;
  --accent:#9be33a; --accent-ink:#0d1d05; --link:#a6e85c; --hi:#ffd43b; --soft:#183a2c; --danger:#ff7a5c; --warn:#ffcf5a; --warn-soft:#3a300e;
  --up:#ff8a4c; --down:#a6e85c; --bar:#33c6d6; --bar-hi:#8eeaf3; --grid:#1b363d;
  --br0:#4fd3e2; --br1:#ff9a5c; --br2:#c9a2ff; --br3:#7db6ff; --br4:#ff8cc6; --sale:#ffd43b; --sale-soft:#3a300e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1b20; --surface:#12282e; --fg:#e9f6e2; --muted:#8eaaa6; --line:#21414a;
  --accent:#9be33a; --accent-ink:#0d1d05; --link:#a6e85c; --hi:#ffd43b; --soft:#183a2c; --danger:#ff7a5c; --warn:#ffcf5a; --warn-soft:#3a300e;
  --up:#ff8a4c; --down:#a6e85c; --bar:#33c6d6; --bar-hi:#8eeaf3; --grid:#1b363d;
  --br0:#4fd3e2; --br1:#ff9a5c; --br2:#c9a2ff; --br3:#7db6ff; --br4:#ff8cc6; --sale:#ffd43b; --sale-soft:#3a300e; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);margin:0}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.pad{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
header{padding-block:14px 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
h1{font-size:1.35rem;margin:0;letter-spacing:-.01em}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.tabs button{padding:9px 0;border-radius:9px;background:none;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
main{flex:1;overflow-y:auto;min-height:0;padding-block:8px 16px}
input{font:inherit;font-size:16px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;width:100%;box-sizing:border-box}
input.num{font-family:var(--mono);text-align:right}
input:focus-visible,button:focus-visible{outline:2px solid var(--link);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;color:var(--fg)}
.primary{background:var(--accent);color:var(--accent-ink);border-radius:10px;font-weight:700;padding:10px 14px}
.ghost{background:none;color:var(--link);font-size:.82rem;padding:6px 0;text-decoration:underline}
.danger{color:var(--danger)}
.note{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:8px 12px;margin-top:8px}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:.9rem;line-height:1.5}
.label{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.label b{font-family:var(--mono);letter-spacing:0;color:var(--fg)}
.hint{font-size:.72rem;color:var(--muted);margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--fg)}
.form-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
/* home */
.home{display:flex;flex-direction:column;justify-content:center;min-height:100%;gap:14px;padding-block:24px}
.start{background:linear-gradient(120deg,var(--accent) 0%,var(--accent) 45%,var(--hi) 100%);color:var(--accent-ink);border-radius:20px;padding:28px 20px;font-size:1.5rem;font-weight:700;text-align:left;display:flex;justify-content:space-between;align-items:center}
.start small{display:block;font-size:.85rem;font-weight:500;opacity:.85;margin-top:4px}
.start .arrow{font-size:2rem}
.homelinks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.homelinks button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.homelinks .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.homelinks .v{font-family:var(--mono);font-weight:700;margin-top:4px;font-size:1.05rem}
/* suggestions */
.suggest{border:1px solid var(--line);border-radius:10px;margin-top:6px;overflow:hidden;background:var(--surface)}
.sg{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:10px 12px;background:none;border-bottom:1px solid var(--line)}
.sg:last-child{border-bottom:0}
.sg .meta{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.sg.new{color:var(--link);font-weight:700}
.usual{display:flex;flex-wrap:wrap;gap:6px}
.usual button{border:1px dashed var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem}
.usual button::before{content:"+ ";color:var(--link);font-weight:700}
/* rows */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li-main{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 12px;width:100%;text-align:left;background:none}
.nm{min-width:0;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:.68rem;background:var(--soft);color:var(--muted);border-radius:6px;padding:2px 6px}
.last{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-align:right;white-space:nowrap}
.li.bought .t,.item.in .t{color:var(--muted);text-decoration:line-through}
.edit{padding:0 12px 12px}
/* shop */
.storebar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.storebar::-webkit-scrollbar{display:none}
.store{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:left;min-width:86px}
.store .s-nm{font-weight:700;font-size:.9rem;display:block}
.store .s-left{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.store[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.store[aria-pressed="true"] .s-left{color:var(--accent-ink);opacity:.85}
.store.done:not([aria-pressed="true"]) .s-left{color:var(--link)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden}
.item-main{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:12px;width:100%;text-align:left;background:none}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:.85rem}
.item.in .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item.other{border-style:dashed}
.paid{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.editor{display:grid;grid-template-columns:1fr auto;gap:6px;padding:0 12px 12px}
.editor .actions{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.82rem;margin-top:10px;line-height:1.4}
details summary{cursor:pointer;color:var(--muted);font-size:.82rem;margin-top:18px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.82rem;margin-top:10px;line-height:1.4}
/* prices */
.prow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 12px;width:100%;text-align:left;background:none}
.chg{font-family:var(--mono);font-size:.72rem}
.chg.up{color:var(--up)} .chg.down{color:var(--down)} .chg.flat{color:var(--muted)}
.big{font-family:var(--mono);font-weight:700;font-size:1.05rem;text-align:right;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block;touch-action:manipulation}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.chart .lbl{fill:var(--fg);font-weight:700}
.chart rect.b{fill:var(--bar)}
.chart rect.b.sel{fill:var(--bar-hi)}
.chart line{stroke:var(--grid)}
.readout{font-family:var(--mono);font-size:.82rem;min-height:1.3em;margin-bottom:4px}
.readout span{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
td.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.d{color:var(--muted);font-family:var(--mono);font-size:.75rem;white-space:nowrap}
.back{background:none;color:var(--link);font-weight:700;padding:6px 0}
footer{background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px}
footer .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
footer .tot{font-family:var(--mono);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums}
footer .right{text-align:right;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.bar{height:6px;background:var(--soft);border-radius:4px;margin-top:6px;width:120px;overflow:hidden;margin-left:auto}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--hi));border-radius:4px}
.storeedit{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:6px}
.li-row{display:grid;grid-template-columns:1fr auto;align-items:center}
.stepper{display:inline-flex;align-items:center;background:var(--soft);border-radius:999px;margin-right:10px}
.stepper button{background:none;width:36px;height:36px;border-radius:999px;font-size:1.15rem;font-weight:700;color:var(--link);padding:0}
.stepper button:disabled{color:var(--muted);opacity:.45;cursor:default}
.stepper b{min-width:22px;text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums}
.qx{font-family:var(--mono);font-weight:700;color:var(--link);margin-right:4px}
.qtyrow{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qtyrow .stepper{margin-right:0}
.each{font-family:var(--mono);font-size:.72rem;color:var(--muted);display:block;text-align:right;font-weight:500}
.qrow{display:grid;grid-template-columns:1fr auto;gap:6px}
.scanbtn{background:var(--soft);color:var(--link);border-radius:10px;font-weight:700;padding:0 14px;display:inline-flex;align-items:center;gap:6px}
.scanbtn svg{width:18px;height:18px;fill:currentColor}
.scanwide{width:100%;justify-content:center;padding:12px;margin-top:10px}
.homescan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.homescan svg{width:28px;height:28px;fill:var(--link);flex:none}
.homescan small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.codes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.code{font-family:var(--mono);font-size:.72rem;background:var(--soft);border-radius:6px;padding:3px 4px 3px 8px;display:inline-flex;align-items:center;gap:4px}
.code button{background:none;color:var(--muted);padding:0 4px}
/* scanner: always dark camera surface; the bottom sheet follows the theme */
.scan{position:fixed;inset:0;z-index:50;background:#0b0f0c;color:#eef3ee;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.scan-top{display:flex;justify-content:space-between;align-items:center;padding-block:12px;gap:8px}
.scan-top b{font-size:1.05rem}
.scan-x{background:#eef3ee;color:#0b0f0c;border-radius:999px;padding:8px 18px;font-weight:700}
.scan-view{position:relative;flex:1;min-height:140px;overflow:hidden;background:#000}
.scan-view video{width:100%;height:100%;object-fit:cover;display:block}
.scan-guide{position:absolute;left:10%;right:10%;top:32%;height:28%;border:3px solid #9be33a;border-radius:14px;box-shadow:0 0 0 2000px rgb(0 0 0 / .38);pointer-events:none}
.scan-guide.hit{border-color:#ffffff}
.scan-status{padding-block:10px;font-size:.92rem;min-height:1.4em;line-height:1.4}
.scan-status b{color:#c6f27e}
.scan-sheet{background:var(--surface);color:var(--fg);border-radius:18px 18px 0 0;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));max-height:62%;overflow-y:auto}
.scan-sheet .num{text-align:left}
.linkrow{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.linkrow button{background:var(--soft);border-radius:8px;padding:8px 10px;text-align:left;font-size:.85rem}

/* product names: brand marker · parent item · size */
.pn{overflow-wrap:anywhere}
.it{font-weight:600}
.brand{display:inline-block;font-weight:700;font-size:.74em;line-height:1.35;padding:0 6px;border-radius:6px;border:1.5px solid currentColor;vertical-align:.08em;margin-right:2px;letter-spacing:.01em}
.brand.b0{color:var(--br0)} .brand.b1{color:var(--br1)} .brand.b2{color:var(--br2)} .brand.b3{color:var(--br3)} .brand.b4{color:var(--br4)}
.sz{display:inline-block;font-family:var(--mono);font-size:.72em;color:var(--muted);background:var(--soft);border-radius:5px;padding:0 5px;vertical-align:.1em}
.li.bought .t .brand,.item.in .t .brand{opacity:.6}
.tag.sale{background:var(--sale-soft);color:var(--sale);font-weight:700}
.tag.budget{background:none;border:1px dashed var(--line)}
.sg-group{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 12px 2px;background:var(--bg)}
/* product fields */
.pf{display:flex;flex-direction:column;gap:6px}
.pf2{display:grid;grid-template-columns:1fr 110px;gap:6px}
.unitrow{margin-top:2px}
/* stats card */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--bg);border-radius:10px;padding:10px;margin:0 0 4px}
.stats .k{font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.stats .v{font-family:var(--mono);font-weight:700;font-size:.92rem;font-variant-numeric:tabular-nums}
.stats .s{font-size:.68rem;color:var(--muted);overflow-wrap:anywhere}
.stats .foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.72rem;color:var(--muted)}
.stats.none{display:block;font-size:.75rem;color:var(--muted)}
/* editors */
.editor{grid-template-columns:1fr}
.erow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.erow .lab{font-size:.72rem;color:var(--muted)}
.pricebox{display:grid;grid-template-columns:1fr auto;gap:6px}
.kgin{max-width:120px}
.sum{font-family:var(--mono);font-size:.78rem;color:var(--fg);min-height:1.2em}
.sum .under{color:var(--down)} .sum .over{color:var(--up)}
.item-row{display:grid;grid-template-columns:1fr auto;align-items:center}
.kgnote{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-right:12px;white-space:nowrap}
.searchrow{margin-top:10px}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:2px;gap:2px;text-transform:none;letter-spacing:0}
.seg button{background:none;border-radius:999px;padding:3px 10px;font-size:.72rem;color:var(--muted);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.triprow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.triprow label{font-size:.78rem;color:var(--muted)}
.triprow input{width:auto;padding:6px 10px;font-family:var(--mono);font-size:15px}
.store.add{min-width:0;border-style:dashed;color:var(--link);font-weight:700;display:flex;align-items:center}
.group-h{font-size:.72rem;font-weight:700;color:var(--fg);margin:14px 0 0;display:flex;justify-content:space-between}
.group-h span{color:var(--muted);font-weight:500;font-family:var(--mono)}
.photo-scan{display:block;text-align:center;margin-top:8px}

footer .lbl{white-space:nowrap}
footer .right{white-space:nowrap}
#bud:empty{display:none}
/* swipe + hold */
.sw{position:relative;overflow:hidden;touch-action:pan-y}
.sw-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700;font-size:.85rem;pointer-events:none;opacity:0}
.sw-bg .l,.sw-bg .r{opacity:.35;transition:opacity .1s}
.sw-bg.go-r .l,.sw-bg.go-l .r{opacity:1}
.sw-bg.right{background:var(--accent);color:var(--accent-ink)}
.sw-bg.left{background:var(--danger);color:#fff}
.sw-fg{position:relative;background:inherit;will-change:transform}
.sw-fg.back{transition:transform .18s ease}
@media (prefers-reduced-motion:reduce){.sw-fg.back{transition:none}}
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgb(0 0 0 / .4);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.sheet h3{margin:4px 0 8px;font-size:1rem}
.sheet button.act{display:block;width:100%;text-align:left;background:none;padding:13px 4px;border-bottom:1px solid var(--line);font-size:1rem}
.sheet button.act.danger{color:var(--danger)}
.sheet button.act:last-child{border-bottom:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:.88rem;box-shadow:0 4px 16px rgb(0 0 0 / .25);max-width:calc(100% - 32px)}
.toast button{background:none;color:var(--accent);font-weight:700;padding:0}
.gesture-tip{font-size:.72rem;color:var(--muted);margin:6px 0 0}
/* app feel: no text highlight on press-and-hold, no double-tap zoom; typing boxes stay selectable */
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
/* sort button */
.sortbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;border-radius:9px;background:var(--soft);color:var(--muted);padding:0;position:relative}
.sortbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sortbtn.on{background:var(--accent);color:var(--accent-ink)}

<script>
/* ===== helpers ===== */
const peso = n => "₱" + (Math.round(n*100)/100).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const peso0 = n => "₱" + Math.round(n).toLocaleString("en-PH");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const norm = s => String(s||"").trim().toLowerCase().replace(/\s+/g," ");
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtDate = (iso, long) => new Date(iso+"T00:00:00").toLocaleDateString("en-PH", long ? {month:"short",day:"numeric",year:"numeric"} : {month:"short",day:"numeric"});
const $ = id => document.getElementById(id);
const el = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(/,/g,"")); return Number.isFinite(n) ? n : null; };
const fmtKg = n => (Math.round(n*1000)/1000).toString();

/* ===== data =====
   stores:   [{id,name}]
   products: [{id, item, brand, size, unit:"pc"|"kg", stores:[storeId…], codes:[barcode…], name}]   ← saved for good
             item is the parent ("Fresh milk"), brand and size tell versions apart; name is "brand item size"
   trip:     {date, items:[{pid, skip:[], qty, est, tags:[], added, bought:{store, price, at}|null}]} | null
             price is per piece, or per kg for items sold by weight (then qty is the weight in kg)
   history:  [{id, date, items:[{pid, store, price, qty, tags}]}]   ← one entry per finished trip */
const KEY = "palengke-v5";
const DEFAULT_STORES = [{id:"mall",name:"Mall"},{id:"mng",name:"MnG"},{id:"palengke",name:"Palengke"},{id:"korean",name:"Korean store"}];
const TAGS = [["sale","Sale"],["b1g1","Buy 1 Get 1"]];
const tagName = t => (TAGS.find(x=>x[0]===t)||[t,t])[1];
const displayName = p => [p.brand, p.item, p.size].map(s => String(s||"").trim()).filter(Boolean).join(" ");
function fixProduct(p){
  if (p.item == null || p.item === "") p.item = p.name || "";
  p.brand = p.brand || ""; p.size = p.size || ""; p.unit = p.unit === "kg" ? "kg" : "pc";
  p.stores = p.stores || []; p.codes = p.codes || []; p.name = displayName(p);
  return p;
}
function fixState(st){
  st.stores = st.stores || JSON.parse(JSON.stringify(DEFAULT_STORES));
  st.products = (st.products || []).map(fixProduct);
  st.history = (st.history || []).map(h => ({...h, lumps:h.lumps||{}, items:(h.items||[]).map(i => ({...i, price:i.price ?? null, qty:i.qty>0?i.qty:1, tags:i.tags||[]}))}));
  st.stores = st.stores.map(s => ({id:s.id, name:s.name, lump:!!s.lump}));
  if (st.trip) st.trip.lump = st.trip.lump || {};
  if (st.trip) st.trip.items = (st.trip.items || []).map((t,i) => ({...t, skip:t.skip||[], qty:t.qty>0?t.qty:1, tags:t.tags||[], est:t.est ?? null, added:t.added||i+1, bought:t.bought ? {...t.bought, at:t.bought.at||0} : null}));
  return st;
}
function sampleData(){
  const P = [["p1","","Chicken thighs","","kg",["mall","mng"]],["p2","","Pork belly","","kg",["mall","mng"]],["p3","","Tofu","","pc",["korean","palengke"]],
             ["p4","","Kangkong","bundle","pc",["palengke"]],["p5","Silver Swan","Soy sauce","1L","pc",["mall"]],["p6","","Eggs","tray","pc",["mall","palengke"]]];
  const trips = [["2026-07-11",[["p1","mall",185],["p2","mng",165],["p3","korean",48],["p4","palengke",20],["p6","mall",235]]],
                 ["2026-08-08",[["p1","mng",188],["p2","mng",170],["p3","palengke",45],["p5","mall",42],["p6","mall",240]]],
                 ["2026-09-05",[["p1","mall",195],["p2","mall",182],["p3","korean",52,["sale"]],["p4","palengke",25],["p6","palengke",238]]],
                 ["2026-10-03",[["p1","mng",205],["p2","mng",185],["p3","korean",55],["p4","palengke",25],["p5","mall",45],["p6","mall",250]]]];
  return fixState({sample:true, stores:JSON.parse(JSON.stringify(DEFAULT_STORES)),
    products:P.map(([id,brand,item,size,unit,stores])=>({id,brand,item,size,unit,stores})),
    history:trips.map(([date,items],i)=>({id:"h"+i,date,items:items.map(([pid,store,price,tags])=>({pid,store,price,qty:1,tags:tags||[]}))})),
    trip:null});
}
let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch(e){ state = null; }
if (!state || !Array.isArray(state.products)) state = migrate() || sampleData();
fixState(state);
function migrate(){
  let v4=null; try { v4 = JSON.parse(localStorage.getItem("palengke-v4")); } catch(e){}
  if (!v4 || v4.sample || !Array.isArray(v4.items) || !v4.items.length) return null;
  const s = {sample:false, stores:v4.stores||JSON.parse(JSON.stringify(DEFAULT_STORES)), products:[], history:[], trip:{date:today(),items:[]}};
  v4.items.forEach(i => {
    let p = s.products.find(x => norm(x.name)===norm(i.name));
    if (!p) { p = fixProduct({id:uid(), item:i.name.trim(), stores:i.stores||[]}); s.products.push(p); }
    if (!s.trip.items.some(t=>t.pid===p.id)) s.trip.items.push({pid:p.id, skip:i.skip||[], bought:i.bought||null});
  });
  return s;
}
let ui = {rotIdx:0, showSaved:false, tab:"list", store:null, editing:null, draft:null, newDraft:null, confirming:null, addStores:[], product:null, query:"", shopQuery:"", openOthers:false, sort:"added", backTab:"list"};
try { Object.assign(ui, JSON.parse(localStorage.getItem(KEY+"-ui")) || {}); } catch(e){}
Object.assign(ui, {editing:null, draft:null, newDraft:null, confirming:null, query:"", shopQuery:""});
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); localStorage.setItem(KEY+"-ui", JSON.stringify({tab:ui.tab,store:ui.store,addStores:ui.addStores,product:ui.product,sort:ui.sort})); } catch(e){} if (typeof push === "function") push(); };
const touch = () => { save(); };
const prod = pid => state.products.find(p=>p.id===pid);
const storeName = id => id === "all" ? "All stores" : (state.stores.find(s=>s.id===id)?.name || "Removed store");
const validStore = () => { if (ui.store !== "all" && !state.stores.some(s=>s.id===ui.store)) ui.store = "all"; };
validStore();

/* price history for a product, oldest → newest */
function purchases(pid){
  const out = [];
  state.history.forEach(h => h.items.forEach(it => { if (it.pid===pid && it.price != null) out.push({date:h.date, store:it.store, price:it.price, qty:qtyOf(it), tags:it.tags||[], reg:it.reg ?? null, hid:h.id}); }));
  out.sort((a,b)=>a.date.localeCompare(b.date));
  return out;
}
const lastBuy = pid => { const p = purchases(pid); return p[p.length-1]; };
const timesBought = pid => state.history.reduce((n,h)=>n+(h.items.some(i=>i.pid===pid)?1:0),0);
// a plain "any brand" version only makes sense when the item has brands; "okra" with one saved version is just that one
const needsGeneric = item => { const sib = state.products.filter(x => norm(x.item) === norm(item)); return !sib.some(isGeneric) && (sib.length > 1 || sib.some(x => x.brand)); };
function makeGeneric(item){
  const sib = state.products.filter(x => norm(x.item) === norm(item));
  const g = sib.find(isGeneric); if (g) return g;
  if (sib.length === 1 && !sib[0].brand) return sib[0];
  const stores = []; sib.forEach(x => x.stores.forEach(s => { if (!stores.includes(s)) stores.push(s); }));
  const p = fixProduct({id:uid(), item:(sib[0]?.item || item).trim(), brand:"", size:"", unit:sib[0]?.unit || "pc", stores, codes:[]});
  state.products.push(p); return p;
}

/* quantities: price is per piece (or per kg); qty is pieces (or kg) */
const isKg = p => !!p && p.unit === "kg";
const qtyOf = t => (t && t.qty > 0) ? t.qty : 1;
const lineTotal = t => t.bought && t.bought.price != null ? t.bought.price * qtyOf(t) : 0;
const histTotal = h => h.items.reduce((a,i)=>a + (i.price != null ? i.price * qtyOf(i) : 0), 0) + Object.values(h.lumps||{}).reduce((a,v)=>a+(v||0),0);
/* stores that are paid as one total (like the palengke): items are only ticked, the store gets one amount per trip */
const isLump = sid => !!state.stores.find(s=>s.id===sid)?.lump;
const lumpTotal = () => state.trip ? Object.values(state.trip.lump||{}).reduce((a,v)=>a+(v||0),0) : 0;
/* an item with no brand and no size is the plain "any brand" version of its parent */
const isGeneric = p => !!p && !p.brand && !p.size;
const siblings = p => state.products.filter(x => x.id !== p.id && norm(x.item) === norm(p.item));
const unitLbl = p => isKg(p) ? "/kg" : "";
const qtyText = (t, p) => isKg(p) ? fmtKg(qtyOf(t)) + " kg" : "×" + qtyOf(t);
function stepper(value, onChange, label){
  const st = el(`<span class="stepper" role="group"><button type="button" data-d="-1">−</button><b aria-live="polite"></b><button type="button" data-d="1">+</button></span>`);
  st.setAttribute("aria-label", "How many " + (label||""));
  const [minus, plus] = st.querySelectorAll("button"); minus.setAttribute("aria-label","One less"); plus.setAttribute("aria-label","One more");
  const paint = v => { st.querySelector("b").textContent = v; minus.disabled = v <= 1; };
  paint(value);
  st.querySelectorAll("button").forEach(b => b.onclick = e => { e.stopPropagation(); e.preventDefault(); value = Math.max(1, Math.min(99, value + +b.dataset.d)); paint(value); onChange(value); });
  return st;
}
/* trip helpers */
const tItems = () => state.trip ? state.trip.items : [];
const tItem = pid => tItems().find(t=>t.pid===pid);
const options = ti => { const p = prod(ti.pid); return ((p && p.stores.length) ? p.stores : state.stores.map(s=>s.id)).filter(s => !ti.skip.includes(s) && state.stores.some(x=>x.id===s)); };
const canBuyAt = (ti, sid) => sid === "all" || options(ti).includes(sid);
const leftAt = sid => tItems().filter(i => !i.bought && canBuyAt(i, sid));
// price used for sorting: what you paid, else the budget, else last price × how many; items with no price go last
function sortPrice(t){ if (t.bought && t.bought.price != null) return lineTotal(t); if (t.est) return t.est; const lb = lastBuy(t.pid); return lb ? lb.price * qtyOf(t) : null; }
function sortItems(arr){
  const key = t => { const p = prod(t.pid) || {}; return [norm(p.item), norm(p.brand), norm(p.size)].join("|"); };
  if (ui.sort === "az") return arr.slice().sort((a,b)=>key(a).localeCompare(key(b)));
  if (ui.sort === "hi" || ui.sort === "lo") {
    const dir = ui.sort === "hi" ? -1 : 1;
    return arr.slice().sort((a,b) => { const x = sortPrice(a), y = sortPrice(b); if (x == null && y == null) return key(a).localeCompare(key(b)); if (x == null) return 1; if (y == null) return -1; return (x - y) * dir; });
  }
  return arr.slice().sort((a,b)=>(a.added||0)-(b.added||0));
}
const byRecent = arr => arr.slice().sort((a,b)=>(b.bought?.at||0)-(a.bought?.at||0));
const matchQ = (p, v) => !v || norm(p.name).includes(v) || norm(p.item).includes(v) || norm(p.brand).includes(v);

function clearSample(){
  if (!state.sample) return;
  state = {sample:false, stores:state.stores, products:[], history:[], trip:state.trip ? {date:today(),items:[]} : null};
}
function sampleNote(main){
  if (!state.sample) return;
  const n = el(`<div class="note"><span>Example data so you can see how it works. Starting your first trip clears it.</span><button class="ghost" type="button">Clear examples</button></div>`);
  n.querySelector("button").onclick = () => { clearSample(); save(); render(); };
  main.appendChild(n);
}

/* ===== shared pieces ===== */
function brandIdx(b){ let h = 0; for (const c of norm(b)) h = (h*31 + c.charCodeAt(0)) >>> 0; return h % 5; }
function nameHTML(p){
  if (!p) return "";
  return `<span class="pn">${p.brand ? `<span class="brand b${brandIdx(p.brand)}">${esc(p.brand)}</span> ` : ""}<span class="it">${esc(p.item || p.name)}</span>${p.size ? ` <span class="sz">${esc(p.size)}</span>` : ""}${isKg(p) ? ` <span class="sz">per kg</span>` : ""}</span>`;
}
function chipRow(selected, onToggle){
  const row = el(`<div class="chips"></div>`);
  state.stores.forEach(s => {
    const c = el(`<button type="button" class="chip"></button>`);
    c._paint = () => { const i = selected.indexOf(s.id); c.setAttribute("aria-pressed", i>=0);
      c.textContent = (i>=0 ? (i===0 ? "1st · " : "Backup · ") : "") + s.name; };
    c._paint();
    c.onclick = () => { onToggle(s.id); row.querySelectorAll(".chip").forEach(x=>x._paint()); };
    row.appendChild(c);
  });
  return row;
}
function pickRow(items, selected, onPick, multi){
  // items: [[value,label]]; single choice unless multi
  const row = el(`<div class="chips"></div>`);
  items.forEach(([v,label]) => {
    const c = el(`<button type="button" class="chip"></button>`); c.textContent = label;
    const on = () => multi ? selected().includes(v) : selected() === v;
    c._paint = () => c.setAttribute("aria-pressed", on());
    c._paint();
    c.onclick = () => { onPick(v); row.querySelectorAll(".chip").forEach(x=>x._paint()); };
    row.appendChild(c);
  });
  return row;
}
function storeTags(p){
  const box = el(`<span class="tags"></span>`);
  (p.stores.length ? p.stores : [null]).forEach((s,i) => { const t = el(`<span class="tag"></span>`); t.textContent = s ? (i ? "or " : "") + storeName(s) : "Any store"; box.appendChild(t); });
  return box;
}
// split "Emborg fresh milk 1L" → size "1L"; brand is left for the person to fill
function guessFields(text){
  const t = String(text||"").trim();
  const m = t.match(/^(.*?)[\s,]+(\d+(?:[.,]\d+)?\s?(?:ml|l|liters?|litres?|g|grams?|kg|kilos?|oz|pcs?|pieces?|pack|packs|s)\b\.?)$/i);
  return m && m[1] ? {item:m[1].trim(), size:m[2].replace(/\s+/g,"")} : {item:t, size:""};
}
function fieldsOf(p){ return {item:p.item||"", brand:p.brand||"", size:p.size||"", unit:p.unit||"pc", stores:(p.stores||[]).slice()}; }
function productFields(f, idp, opts = {}){
  // f is a draft object; edits land on it directly so a redraw keeps what was typed
  const box = el(`<div class="pf">
    <input id="${idp}-item" placeholder="Item, e.g. Fresh milk" aria-label="Item name" autocomplete="off">
    <div class="pf2"><input id="${idp}-brand" placeholder="Brand (optional)" aria-label="Brand" autocomplete="off"><input id="${idp}-size" placeholder="Size, e.g. 1L" aria-label="Size" autocomplete="off"></div>
    <div class="unitrow" data-unit></div>
    ${opts.noStores ? "" : `<div class="hint" style="margin-top:2px">Where to buy it? Tap your first choice, then any backups.</div><div data-stores></div>`}
  </div>`);
  [["item","item"],["brand","brand"],["size","size"]].forEach(([k]) => { const i = box.querySelector(`#${idp}-${k}`); i.value = f[k] || ""; i.oninput = () => { f[k] = i.value; i.setCustomValidity(""); opts.onInput && opts.onInput(); }; });
  box.querySelector("[data-unit]").replaceWith(pickRow([["pc","Sold per piece"],["kg","Sold by weight (kg)"]], () => f.unit, v => { f.unit = v; }));
  if (!opts.noStores) box.querySelector("[data-stores]").replaceWith(chipRow(f.stores, id => { const i = f.stores.indexOf(id); i>=0 ? f.stores.splice(i,1) : f.stores.push(id); opts.onStores && opts.onStores(f.stores); }));
  return box;
}
function checkFields(f, idp, selfId){
  const item = $(idp+"-item");
  if (!String(f.item||"").trim()) { if (item) { item.setCustomValidity("Type the item name."); item.reportValidity(); } return false; }
  const name = displayName(f);
  const dup = state.products.find(x => x.id !== selfId && norm(x.name) === norm(name));
  if (dup) { if (item) { item.setCustomValidity(`You already have “${dup.name}”. Add a brand or size to tell them apart.`); item.reportValidity(); } return false; }
  return true;
}
function applyFields(p, f){ p.item = f.item.trim(); p.brand = (f.brand||"").trim(); p.size = (f.size||"").trim(); p.unit = f.unit === "kg" ? "kg" : "pc"; if (f.stores) p.stores = f.stores.slice(); fixProduct(p); return p; }
function codesBox(p){
  const cbox = el(`<div class="codes"></div>`);
  const paint = () => { cbox.innerHTML = ""; (p.codes||[]).forEach(c => {
      const t = el(`<span class="code"></span>`); t.textContent = "▥ " + c;
      const x = el(`<button type="button" aria-label="Remove barcode">✕</button>`); x.onclick = () => { const cur = prod(p.id); if (cur) { cur.codes = cur.codes.filter(y=>y!==c); touch(); } p.codes = (p.codes||[]).filter(y=>y!==c); paint(); };
      t.appendChild(x); cbox.appendChild(t); }); };
  paint(); return cbox;
}
function statsCard(p){
  const b = purchases(p.id);
  if (!b.length) return el(`<div class="stats none">No price history yet. The price you enter is saved when you finish this trip.</div>`);
  const u = unitLbl(p), first = b[0], last = b[b.length-1];
  const low = b.reduce((m,x)=> x.price < m.price ? x : m, b[0]);
  const chg = b.length > 1 ? changeTag(first.price, last.price) : `<span class="chg flat">first price</span>`;
  const c = el(`<div class="stats">
    <div><div class="k">Last paid</div><div class="v">${esc(peso0(last.price))}${u}</div><div class="s">${esc(fmtDate(last.date))} · ${esc(storeName(last.store))}</div></div>
    <div><div class="k">Lowest</div><div class="v">${esc(peso0(low.price))}${u}</div><div class="s">${esc(fmtDate(low.date))} · ${esc(storeName(low.store))}</div></div>
    <div><div class="k">Change</div><div class="v">${chg}</div><div class="s">${b.length>1 ? "since " + esc(fmtDate(first.date)) : ""}</div></div>
    <div class="foot"><span>Bought ${b.length} time${b.length===1?"":"s"}</span><button class="ghost" type="button" style="padding:0">Price chart →</button></div>
  </div>`);
  c.querySelector("button").onclick = () => { ui.backTab = ui.tab; ui.tab = "prices"; ui.product = p.id; closeEditor(); save(); render(); $("main").scrollTop = 0; };
  return c;
}
function openEditor(pid, draft){ ui.editing = pid; ui.draft = draft; ui.confirming = null; }
function closeEditor(){ ui.editing = null; ui.draft = null; }


/* ===== gestures: swipe a row left/right, press and hold for a menu ===== */
function swipeable(row, fg, opts){
  // opts: {right:{label, run}, left:{label, run}, hold:fn}
  row.classList.add("sw"); fg.classList.add("sw-fg");
  const bg = el(`<div class="sw-bg" aria-hidden="true"><span class="l"></span><span class="r"></span></div>`);
  bg.querySelector(".l").textContent = opts.right ? opts.right.label : ""; bg.querySelector(".r").textContent = opts.left ? opts.left.label : "";
  row.insertBefore(bg, fg);
  let x0=0, y0=0, dx=0, active=false, swiping=false, held=false, timer=null, pid=null;
  const reset = () => { fg.classList.add("back"); fg.style.transform = ""; bg.style.opacity = 0; setTimeout(()=>fg.classList.remove("back"), 200); };
  row.addEventListener("pointerdown", e => {
    if (e.button > 0 || e.target.closest(".stepper, input, .editor, .edit")) return;
    active = true; swiping = false; held = false; x0 = e.clientX; y0 = e.clientY; dx = 0; pid = e.pointerId;
    clearTimeout(timer);
    if (opts.hold) timer = setTimeout(() => { if (active && !swiping) { held = true; try { navigator.vibrate && navigator.vibrate(30); } catch(_){} opts.hold(); } }, 480);
  });
  row.addEventListener("pointermove", e => {
    if (!active || e.pointerId !== pid) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (!swiping && (Math.abs(mx) > 8 || Math.abs(my) > 8)) clearTimeout(timer);
    if (!swiping && Math.abs(mx) > 14 && Math.abs(mx) > Math.abs(my) * 1.4 && ((mx > 0 && opts.right) || (mx < 0 && opts.left))) { swiping = true; try { row.setPointerCapture(pid); } catch(_){} }
    if (!swiping) return;
    dx = Math.max(opts.left ? -160 : 0, Math.min(opts.right ? 160 : 0, mx));
    fg.style.transform = `translateX(${dx}px)`;
    bg.style.opacity = 1; bg.className = "sw-bg " + (dx > 0 ? "right" : "left") + (Math.abs(dx) > 80 ? (dx > 0 ? " go-r" : " go-l") : "");
  });
  const end = () => {
    clearTimeout(timer); if (!active) return; active = false;
    if (swiping) { const go = Math.abs(dx) > 80 ? (dx > 0 ? opts.right : opts.left) : null; reset(); row._eatClick = true; setTimeout(()=>row._eatClick=false, 350); if (go) setTimeout(go.run, 120); }
    else if (held) { row._eatClick = true; setTimeout(()=>row._eatClick=false, 350); }
  };
  row.addEventListener("pointerup", end); row.addEventListener("pointercancel", () => { clearTimeout(timer); active = false; if (swiping) reset(); });
  row.addEventListener("click", e => { if (row._eatClick) { e.stopPropagation(); e.preventDefault(); row._eatClick = false; } }, true);
  row.addEventListener("contextmenu", e => { if (opts.hold) e.preventDefault(); });
}
function sheet(title, actions){
  const bgEl = el(`<div class="sheet-bg" role="dialog" aria-modal="true"><div class="sheet pad"><h3></h3></div></div>`);
  bgEl.querySelector("h3").innerHTML = title;
  const sh = bgEl.querySelector(".sheet");
  const close = () => bgEl.remove();
  [...actions.filter(Boolean), {label:"Cancel", run:()=>{}}].forEach(a => {
    const b = el(`<button type="button" class="act${a.danger ? " danger" : ""}"></button>`); b.textContent = a.label;
    if (a.checked != null) { b.setAttribute("role", "menuitemradio"); b.setAttribute("aria-checked", a.checked); }
    b.onclick = () => { close(); a.run(); }; sh.appendChild(b);
  });
  bgEl.onclick = e => { if (e.target === bgEl) close(); };
  document.body.appendChild(bgEl);
  sh.querySelector("button")?.focus();
}
let toastTimer = null;
function toast(msg, undo){
  document.querySelector(".toast")?.remove(); clearTimeout(toastTimer);
  const t = el(`<div class="toast" role="status"><span></span>${undo ? '<button type="button">Undo</button>' : ""}</div>`);
  t.querySelector("span").textContent = msg;
  if (undo) t.querySelector("button").onclick = () => { t.remove(); undo(); };
  document.body.appendChild(t); toastTimer = setTimeout(() => t.remove(), 5000);
}
function removeFromTrip(pid){
  const i = tItems().findIndex(t => t.pid === pid); if (i < 0) return;
  const saved = JSON.parse(JSON.stringify(state.trip.items[i])), p = prod(pid);
  state.trip.items.splice(i, 1); if (ui.editing === pid) closeEditor(); touch(); render();
  toast(`Removed ${p ? p.name : "item"}`, () => { if (state.trip && !tItem(pid)) { state.trip.items.push(saved); touch(); render(); } });
}
function openChart(pid){ ui.backTab = ui.tab; ui.tab = "prices"; ui.product = pid; closeEditor(); save(); render(); $("main").scrollTop = 0; }

/* no pinch zoom inside the app */
["gesturestart","gesturechange","gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive:false}));
document.addEventListener("touchmove", e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, {passive:false});
let rotTimer = null;

/* ===== HOME ===== */
function startTrip(){ if (state.sample) clearSample(); state.trip = {date:today(), items:[]}; ui.tab="list"; ui.store="all"; validStore(); save(); render(); setTimeout(()=>$("q")?.focus(),50); }
function renderHome(main){

    <button type="button"><div class="k">Last trip</div><div class="v">${last ? peso0(histTotal(last)) : "—"}</div><div class="hint" style="margin:2px 0 0">${last ? fmtDate(last.date,true) : "No trips yet"}</div></button>

/* ===== LIST ===== */
function addToTrip(p, more){
  const t = tItem(p.id);
  if (!t) state.trip.items.push({pid:p.id, skip:[], bought:null, added:Date.now(), qty:1, est:null, tags:[]});
  else if (more && !isKg(p)) t.qty = Math.min(99, qtyOf(t) + 1);
}
function renderList(main){
  sampleNote(main);

  const box = el(`<div class="card">
    <div class="qrow"><input id="q" placeholder="Type an item, e.g. Patis" aria-label="Item to buy" autocomplete="off" enterkeyhint="done"><span data-scan></span></div>
    <div id="sgBox"></div>
  </div>`);
  box.querySelector("[data-scan]").replaceWith(scanButton("Scan", "", "list"));
  const q = box.querySelector("#q"), sgBox = box.querySelector("#sgBox");
  q.value = ui.query;
  const addAndReset = (p, more) => { addToTrip(p, more); ui.query = ""; ui.newDraft = null; touch(); render(); $("q")?.focus(); };
  const paint = () => {
    sgBox.innerHTML = "";
    if (ui.newDraft) return paintNew();
    const v = norm(q.value); if (!v) return;
    const exact = state.products.find(p => norm(p.name) === v);
    const matches = state.products.filter(p => matchQ(p, v))
      .sort((a,b) => (norm(b.item).startsWith(v) - norm(a.item).startsWith(v)) || norm(a.item).localeCompare(norm(b.item)) || timesBought(b.id)-timesBought(a.id) || a.name.localeCompare(b.name))
      .slice(0, 10);
    const list = el(`<div class="suggest"></div>`);
    const groups = {}; matches.forEach(p => { const k = norm(p.item); groups[k] = (groups[k]||0) + 1; });
    let lastGroup = null;
    matches.forEach(p => {
      const g = norm(p.item);
      if (g !== lastGroup) {
        const all = state.products.filter(x=>norm(x.item)===g);
        if (all.length > 1 || needsGeneric(p.item)) {
          const h = el(`<div class="sg-group"></div>`); h.textContent = `${p.item} · ${all.length} saved`; list.appendChild(h);
          if (needsGeneric(p.item)) {            // offer the plain version: decide the brand at the store
            const a = el(`<button type="button" class="sg"><span class="nm"><span class="pn"><span class="it"></span></span> <span class="tag budget">any brand</span></span><span class="meta">pick brand at the store</span></button>`);
            a.querySelector(".it").textContent = p.item;
            a.onclick = () => addAndReset(makeGeneric(p.item), true);
            list.appendChild(a);
          }
        }
      }
      lastGroup = g;
      const lb = lastBuy(p.id), ot = tItem(p.id);
      const s = el(`<button type="button" class="sg"><span class="nm">${nameHTML(p)}</span><span class="meta"></span></button>`);
      s.querySelector(".meta").textContent = ot ? (isKg(p) ? "on list" : `on list ×${qtyOf(ot)} · +1`) : (isGeneric(p) && groups[g] > 1 ? "any brand" : (lb ? "last " + peso0(lb.price) + unitLbl(p) : "saved"));
      s.onclick = () => addAndReset(p, true);
      list.appendChild(s);
    });
    if (!exact) {
      const s = el(`<button type="button" class="sg new"></button>`);
      s.textContent = `+ Add “${q.value.trim()}” as a new item`;
      s.onclick = () => { const g = guessFields(q.value); ui.newDraft = {item:g.item, brand:"", size:g.size, unit:"pc", stores:ui.addStores.filter(id=>state.stores.some(s=>s.id===id))}; paint(); $("nf-brand")?.focus(); };
      list.appendChild(s);
    }
    sgBox.appendChild(list);
  };
  const paintNew = () => {
    const f = ui.newDraft;
    const w = el(`<div style="margin-top:10px"><div class="hint" style="margin:0 0 6px">New item. Add the brand and size so versions don't get mixed up.</div><div data-f></div>
      <div class="form-foot"><button class="ghost" type="button" data-a="cancel">Cancel</button><button class="primary" type="button" data-a="ok">Add to list</button></div></div>`);
    w.querySelector("[data-f]").replaceWith(productFields(f, "nf", {onStores: s => { ui.addStores = s.slice(); save(); }}));
    w.querySelector('[data-a="cancel"]').onclick = () => { ui.newDraft = null; paint(); };
    w.querySelector('[data-a="ok"]').onclick = () => {
      if (!checkFields(f, "nf")) return;
      const p = applyFields({id:uid(), codes:[]}, f); state.products.push(p); addAndReset(p);
    };
    sgBox.appendChild(w);
  };
  q.oninput = () => { ui.query = q.value; ui.newDraft = null; paint(); };
  q.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); const v = norm(q.value); if (!v) return;
    const exact = state.products.find(p => norm(p.name) === v);
    if (exact) addAndReset(exact, true);
    else if (state.products.some(p => norm(p.item) === v)) addAndReset(makeGeneric(q.value), true);    // "eggs" → Eggs, any brand
    else { const s = sgBox.querySelector(".sg.new"); s && s.click(); } } };
  main.appendChild(box);
  paint();

  // saved items not on this trip, most bought first
  const onTrip = new Set(tItems().map(t=>t.pid));
  const usual = state.products.filter(p => !onTrip.has(p.id)).sort((a,b)=>timesBought(b.id)-timesBought(a.id) || a.name.localeCompare(b.name));
  if (usual.length && !ui.showSaved) {
    // one suggestion at a time, from things you've bought before (latest first), fading to the next every 1.4 s
    const lastDate = pid => { let d = ""; state.history.forEach(h => { if (h.date > d && h.items.some(i=>i.pid===pid)) d = h.date; }); return d; };
    const bought = usual.filter(p => timesBought(p.id)).sort((a,b)=>lastDate(b.id).localeCompare(lastDate(a.id)) || timesBought(b.id)-timesBought(a.id));
    const pool = (bought.length ? bought : usual).slice(0, 12);
    const row = el(`<div class="suggestrow"><button type="button" class="rot" aria-live="polite"><span class="rotx"><span class="k">Bought before, tap to add</span><span class="v"></span></span><span class="plus">+</span></button><button class="ghost" type="button">All saved (${usual.length})</button></div>`);
    const v = row.querySelector(".v");
    let i = ui.rotIdx % pool.length || 0;
    const show = () => { v.textContent = pool[i].name; };
    show();
    row.querySelector(".rot").onclick = () => { const p = prod(pool[i].id); if (p) { addToTrip(p); touch(); render(); } };
    row.querySelector(".ghost").onclick = () => { ui.showSaved = true; render(); };
    if (pool.length > 1) rotTimer = setInterval(() => {
      if (!v.isConnected) { clearInterval(rotTimer); return; }
      v.classList.add("fade");
      setTimeout(() => { i = (i + 1) % pool.length; ui.rotIdx = i; show(); v.classList.remove("fade"); }, 350);
    }, 1400);
    main.appendChild(row);
  } else if (usual.length) {
    const ul = el(`<div class="label"><span>Saved items, tap to add</span></div>`);
    const ctr = el(`<span style="display:flex;gap:14px"></span>`);
    const mb = el(`<button class="ghost" type="button" style="padding:0;font-size:.72rem;letter-spacing:0;text-transform:none">Manage</button>`); mb.onclick = openItems;
    const hb = el(`<button class="ghost" type="button" style="padding:0;font-size:.72rem;letter-spacing:0;text-transform:none">Hide</button>`); hb.onclick = () => { ui.showSaved = false; render(); };
    ctr.append(mb, hb); ul.appendChild(ctr); main.appendChild(ul);
    const u = el(`<div class="usual"></div>`);
    usual.forEach(p => {

      else r.querySelector(".li-row").appendChild(stepper(qtyOf(ti), v => { const cur = tItem(p.id); if (cur) { cur.qty = v; touch(); render(); } }, p.name));
      const openIt = () => { const cur = tItem(p.id); if (!cur) return; openEditor(p.id, {kind:"list", f:fieldsOf(prod(p.id)), est: cur.est ? String(cur.est) : ""}); render(); };
      r.querySelector(".li-main").onclick = () => { if (ui.editing === p.id) { closeEditor(); render(); } else openIt(); };
      if (ui.editing !== p.id) swipeable(r, r.querySelector(".li-row"), {
        right: {label:"Edit", run: openIt},
        left: {label:"Remove", run: () => removeFromTrip(p.id)},
        hold: () => sheet(nameHTML(p), [
          {label:"Edit item or budget", run: openIt},
          !isKg(p) && {label:"Add one more", run: () => { const cur = tItem(p.id); if (cur) { cur.qty = Math.min(99, qtyOf(cur)+1); touch(); render(); } }},
          purchases(p.id).length && {label:"See price chart", run: () => openChart(p.id)},
          {label:"Remove from this trip", danger:true, run: () => removeFromTrip(p.id)}])});
      if (ui.editing === p.id && ui.draft?.kind === "list") r.appendChild(listEditor(p, ti));
      rows.appendChild(r);
    });
    main.appendChild(rows);
    });
  }

  if (items.length) { const go = el(`<button class="primary" type="button" style="width:100%;margin-top:18px">Go shopping</button>`); go.onclick = () => setTab("shop"); main.appendChild(go); }
  cancelTripControl(main);
}

    price: inCart && ti.bought.price != null ? String(ti.bought.price) : "", qty: qtyOf(ti), kg: isKg(p) ? (inCart ? fmtKg(qtyOf(ti)) : "") : "",

    tags: (ti.tags||[]).slice(), reg: ti.bought?.reg != null && !(ti.tags||[]).includes("b1g1") ? String(ti.bought.reg) : "", edit:false, f:fieldsOf(p),
    // Buy 1 Get 1 is stored as 2 pieces at half price; show it back as the shelf price for one set
    ...((ti.tags||[]).includes("b1g1") && ti.bought && ti.bought.price != null ? {price:String(ti.bought.reg ?? ti.bought.price*2), qty:Math.max(1, Math.round(qtyOf(ti)/2))} : {})};

  if (showStep) tags.appendChild(el(`<span class="tag${ti.est ? " budget" : ""}">${hint}</span>`));
  (ti.tags||[]).forEach(t => tags.appendChild(el(`<span class="tag sale">${esc(tagName(t))}</span>`)));
  if (inCart && (sid === "all" || kind === "cart-all") && !inTotal) tags.appendChild(el(`<span class="tag">${esc(storeName(ti.bought.store))}</span>`));
  if (kind === "here" && sid !== "all" && options(ti)[0] !== sid) tags.appendChild(el(`<span class="tag">backup here</span>`));

function shopEditor(ti, p, sid, kind){

    <div class="sum" data-sum></div>
    <div data-tags></div>
    <div data-editbox></div>
    <div class="actions">${inCart?'<button class="ghost danger" type="button" data-a="out">Take out of cart</button>':(kind==="here" && sid!=="all"?'<button class="ghost danger" type="button" data-a="na">Not available here</button>':'<span></span>')}
      <span style="display:flex;gap:14px">${d.pick === pid ? `<button class="ghost" type="button" data-a="edit">${d.edit ? "Hide item details" : "Edit item"}</button>` : ""}<button class="ghost" type="button" data-a="cancel">Cancel</button></span></div></form>`);

  ed.querySelector("[data-tags]").replaceWith(pickRow(TAGS, () => d.tags, v => { const i = d.tags.indexOf(v); i>=0 ? d.tags.splice(i,1) : d.tags.push(v); render(); }, true));
  const b1 = d.tags.includes("b1g1") && !kg, sale = d.tags.includes("sale");
  if (sale && !b1) { const r = el(`<div class="erow"><label class="lab" for="se-reg">Regular price (optional)</label><input id="se-reg" class="num kgin" type="number" inputmode="decimal" min="0" step="any" placeholder="₱ normal"></div>`);
    const ri = r.querySelector("input"); ri.value = d.reg || ""; ri.oninput = () => { d.reg = ri.value; paintSum(); }; ed.querySelector(".actions").before(r); }
  if (b1) ed.querySelector(".actions").before(el(`<div class="hint" style="margin:0">Buy 1 Get 1: type the shelf price for one. The app records 2 pieces at half price each, so your price history stays fair.</div>`));

      if (d.tags.includes("b1g1") && !kg) html += ` · you take home ${q*2}`;
      const reg = num(d.reg); if (d.tags.includes("sale") && !d.tags.includes("b1g1") && reg && reg > v) html += ` · <span class="under">saved ${esc(peso0((reg - v) * q))}</span>`;
      if (ti.est) { const diff = ti.est - line; html += diff >= 0 ? ` · <span class="under">${esc(peso0(diff))} under budget</span>` : ` · <span class="over">${esc(peso0(-diff))} over budget</span>`; }

function barChart(points, onPick, picked){
  // points: [{label, value, mark}] oldest→newest, one series, one y-axis from 0; mark = bought on sale / B1G1
  const W = 340, H = 170, L = 8, R = 8, T = 22, B = 22;
  const max = Math.max(...points.map(p=>p.value)) || 1;
  const step = niceStep(max / 3); const top = Math.ceil(max/step)*step;
  const n = points.length, slot = (W-L-R)/n, bw = Math.min(36, slot*0.62);
  const y = v => T + (H-T-B) * (1 - v/top);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price over time">`;
  for (let g=0; g<=top+1e-9; g+=step) s += `<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke-width="1"/>`;
  points.forEach((p,i) => {
    const cx = L + slot*i + slot/2, yy = y(p.value), h = (H-B) - yy, x = cx-bw/2, r = Math.min(4, bw/2, h);
    const path = `M${x},${H-B} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${H-B} Z`;
    const fill = i===picked ? "--bar-hi" : (p.mark ? "--hi" : "--bar");
    s += `<path d="${path}" style="fill:var(${fill})"/>`;
    s += `<rect x="${L+slot*i}" y="0" width="${slot}" height="${H}" fill="transparent" data-i="${i}" style="cursor:pointer"/>`;
    if (i===0 || i===n-1 || i===picked) s += `<text class="lbl" x="${cx}" y="${yy-6}" text-anchor="middle">${esc(peso0(p.value))}</text>`;
    if (n<=8 || i%Math.ceil(n/8)===0 || i===n-1) s += `<text x="${cx}" y="${H-6}" text-anchor="middle">${esc(p.label)}</text>`;
  });
  s += `</svg>`;
  const wrap = el(`<div>${s}</div>`);
  wrap.querySelectorAll("rect[data-i]").forEach(r => r.onclick = () => onPick(+r.dataset.i));
  return wrap;
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x||1))); const f = x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function changeTag(first, last){
  if (first==null || last==null || first===0) return `<span class="chg flat">—</span>`;
  const pct = (last-first)/first*100;
  const cls = pct>0.5 ? "up" : pct<-0.5 ? "down" : "flat";
  return `<span class="chg ${cls}">${pct>0?"▲ +":pct<0?"▼ ":""}${Math.round(pct)}%</span>`;
}

function listen(){
  stopListening();
  const base = sync.db.doc("households/main");
  sync.r = {meta:null, products:{}, history:{}, tripItems:{}};
  const got = {}, cache = {};
  const onErr = e => { sync.status = e.code === "permission-denied" ? "denied" : "error"; sync.err = e.message; stopListening(); render(); };
  const after = (key, fromCache) => { got[key] = true; cache[key] = fromCache;
    if (Object.keys(got).length < 4) return;
    if (!sync.ready) firstLoad(Object.values(cache).some(Boolean)); else applyRemote(); };
  sync.unsubs.push(base.collection("meta").doc("info").onSnapshot({includeMetadataChanges:true}, s => { sync.r.meta = s.exists ? s.data() : null; after("meta", s.metadata.fromCache); }, onErr));
  ["products","history","tripItems"].forEach(c => sync.unsubs.push(base.collection(c).onSnapshot({includeMetadataChanges:true}, qs => {
    qs.docChanges().forEach(ch => { if (ch.type === "removed") delete sync.r[c][ch.doc.id]; else sync.r[c][ch.doc.id] = ch.doc.data(); });
    after(c, qs.metadata.fromCache); }, onErr)));
}
function stopListening(){ sync.unsubs.forEach(u => { try { u(); } catch(e){} }); sync.unsubs = []; sync.ready = false; }
function authError(e){
  const c = e && e.code || "";
  if (c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request") return "";
  if (c === "auth/unauthorized-domain") return "Sign-in is blocked for this website. In Firebase, add meow-w11.github.io under Authentication → Settings → Authorized domains.";
  if (c === "auth/operation-not-allowed") return "Google sign-in isn't turned on yet. In Firebase, enable Google under Authentication → Sign-in method.";
  if (c === "auth/network-request-failed") return "No internet connection. Connect once to sign in; after that the app works offline.";
  return "Sign-in didn't work (" + (c || "unknown error") + "). Try again.";
}
async function signIn(){
  sync.err = ""; const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
  try { await sync.auth.signInWithPopup(p); }
  catch (e) {
    if (["auth/popup-blocked","auth/operation-not-supported-in-this-environment"].includes(e.code)) { try { await sync.auth.signInWithRedirect(p); return; } catch(e2){ e = e2; } }
    sync.err = authError(e); render();
  }
}
function signOut(){ stopListening(); sync.auth.signOut(); }
function startSync(){
  if (!SYNC) { render(); return; }
  firebase.initializeApp(FB_CONFIG);
  sync.auth = firebase.auth(); sync.db = firebase.firestore();
  sync.db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  sync.auth.getRedirectResult().catch(e => { if (["auth/unauthorized-domain","auth/operation-not-allowed"].includes(e.code)) { sync.err = authError(e); render(); } });
  sync.auth.onAuthStateChanged(u => {
    sync.user = u; sync.err = sync.err || "";
    if (u) { sync.status = "loading"; listen(); } else { stopListening(); sync.status = "signedout"; }
    render();
  });
  addEventListener("online", () => { sync.online = true; render(); });
  addEventListener("offline", () => { sync.online = false; render(); });
  render();
}
function renderGate(main){
  const w = el(`<div class="home"></div>`);
  if (sync.status === "starting" || (sync.user && sync.status === "loading")) {
    w.appendChild(el(`<div class="empty">${sync.user ? "Loading your shared list…" : "Starting…"}</div>`));
  } else if (sync.status === "denied") {
    const c = el(`<div class="card"><b>This account doesn't have access</b><div class="hint" style="font-size:.85rem"></div><div class="form-foot"><span></span><button class="primary" type="button">Use a different account</button></div></div>`);
    c.querySelector(".hint").textContent = `${sync.user?.email || "This Google account"} isn't on the list of people who can open this grocery list. Sign in with the Google account you set up for Palengke List.`;
    c.querySelector("button").onclick = () => { sync.err = ""; signOut(); };
    w.appendChild(c);
  } else if (sync.status === "error") {
    const c = el(`<div class="card"><b>Couldn't load the shared list</b><div class="hint" style="font-size:.85rem">Check your connection, then try again.</div><div class="form-foot"><button class="ghost" type="button" data-a="out">Sign out</button><button class="primary" type="button" data-a="retry">Try again</button></div></div>`);
    c.querySelector('[data-a="retry"]').onclick = () => { sync.status = "loading"; listen(); render(); };
    c.querySelector('[data-a="out"]').onclick = signOut;
    w.appendChild(c);
  } else {
    const b = el(`<button class="start" type="button"><span>Sign in with Google<small>You and your partner share one list and one price history</small></span><span class="arrow">→</span></button>`);
    b.onclick = signIn; w.appendChild(b);
    if (sync.err) { const m = el(`<div class="warnbox"></div>`); m.textContent = sync.err; w.appendChild(m); }
  }
  main.appendChild(w);
}
function accountLine(){
  if (!SYNC || !sync.user) return null;
  const a = el(`<div class="hint" style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><span></span><button class="ghost" type="button">Sign out</button></div>`);
  a.firstChild.textContent = (sync.online ? "Synced · " : "Offline · changes sync when you're back online · ") + sync.user.email;
  a.querySelector("button").onclick = signOut;
  return a;
}

/* ===== SAVED ITEMS (grouped by item; edit / delete for good) ===== */
function backButton(main){
  const to = state.trip ? (ui.backTab === "shop" ? "shop" : "list") : "list";
  const back = el(`<button class="back" type="button">${state.trip ? "← Back to " + (to === "shop" ? "Shop" : "List") : "← Home"}</button>`);
  back.onclick = () => { ui.tab = to; closeEditor(); ui.confirming = null; save(); render(); };
  main.appendChild(back);
}
function openItems(){ ui.backTab = ["list","shop"].includes(ui.tab) ? ui.tab : "list"; ui.tab = "items"; closeEditor(); ui.confirming = null; ui.itemQuery = ""; save(); render(); $("main").scrollTop = 0; }
function deleteProduct(pid){
  state.products = state.products.filter(x => x.id !== pid);
  if (state.trip) state.trip.items = state.trip.items.filter(t => t.pid !== pid);
  state.history.forEach(h => h.items = h.items.filter(i => i.pid !== pid));
  state.history = state.history.filter(h => h.items.length);
  if (ui.product === pid) ui.product = null;
}
function renderItems(main){
  backButton(main);
  main.appendChild(el(`<h2 style="margin:6px 0 2px;font-size:1.2rem">Saved items</h2>`));
  main.appendChild(el(`<div class="hint" style="margin-top:0">Grouped by item. Tap one to change its brand, size, stores or barcodes, or to delete it.</div>`));
  const f = el(`<div class="card"><input id="itemQ" placeholder="Search saved items" aria-label="Search saved items" autocomplete="off"></div>`);
  const q = f.querySelector("input"); q.value = ui.itemQuery || "";
  main.appendChild(f);
  const box = el(`<div style="margin-top:4px"></div>`); main.appendChild(box);
  const paint = () => {
    box.innerHTML = ""; const v = norm(q.value);
    if (!state.products.length) { box.appendChild(el(`<div class="empty">No saved items yet. Items you add to a trip or scan are saved here.</div>`)); return; }
    const list = state.products.filter(p => matchQ(p, v)).sort((a,b)=>norm(a.item).localeCompare(norm(b.item)) || a.name.localeCompare(b.name));
    if (!list.length) { box.appendChild(el(`<div class="empty">No saved item matches “${esc(q.value)}”.</div>`)); return; }
    const groups = []; list.forEach(p => { const k = norm(p.item); const g = groups[groups.length-1]; if (g && g.k === k) g.items.push(p); else groups.push({k, name:p.item, items:[p]}); });
    groups.forEach(g => {
      const h = el(`<div class="group-h"><b></b><span>${g.items.length}</span></div>`); h.querySelector("b").textContent = g.name; box.appendChild(h);
      const rows = el(`<div class="rows" style="margin-top:4px"></div>`);
      g.items.forEach(p => {
        const n = purchases(p.id).length;
        const r = el(`<div class="li"><button type="button" class="li-main"><span class="nm"><span class="t">${nameHTML(p)}</span></span><span class="last"></span></button></div>`);
        r.querySelector(".nm").appendChild(storeTags(p));
        r.querySelector(".last").textContent = (n ? n + " price" + (n===1?"":"s") : "no prices") + ((p.codes||[]).length ? " · ▥" : "");
        r.querySelector(".li-main").onclick = () => { if (ui.editing === p.id) closeEditor(); else openEditor(p.id, {kind:"item", f:fieldsOf(p)}); render(); };
        if (ui.editing === p.id && ui.draft?.kind === "item") r.appendChild(savedItemEditor(p));
        rows.appendChild(r);
      });
      box.appendChild(rows);
    });
  };
  q.oninput = () => { ui.itemQuery = q.value; paint(); };
  paint();
}
function savedItemEditor(p){
  const d = ui.draft, pid = p.id;
  const ed = el(`<form class="edit" autocomplete="off" style="display:flex;flex-direction:column;gap:8px">
    <div data-stats></div><div data-f></div><div data-codes></div>
    <div class="form-foot" style="margin-top:0"><button class="ghost danger" type="button" data-a="del">Delete item</button>
      <span style="display:flex;gap:12px;align-items:center"><button class="ghost" type="button" data-a="cancel">Cancel</button><button class="primary" type="submit">Save</button></span></div>
    <div data-confirm></div>
  </form>`);
  ed.querySelector("[data-stats]").replaceWith(statsCard(p));
  ed.querySelector("[data-f]").replaceWith(productFields(d.f, "ie"));
  ed.querySelector("[data-codes]").replaceWith(codesBox(p));
  ed.onsubmit = e => { e.preventDefault(); if (!checkFields(d.f, "ie", pid)) return; const cp = prod(pid); if (cp) applyFields(cp, d.f); closeEditor(); touch(); render(); };
  ed.querySelector('[data-a="cancel"]').onclick = () => { closeEditor(); ui.confirming = null; render(); };
  const cf = ed.querySelector("[data-confirm]");
  const showConfirm = () => {
    const n = purchases(pid).length, onTrip = !!tItem(pid);
    const c = el(`<div class="warnbox"><div></div><div class="form-foot"><button class="ghost" type="button" data-a="no">Keep it</button><button class="primary" type="button" data-a="yes" style="background:var(--danger);color:#fff">Delete for good</button></div></div>`);
    c.firstChild.textContent = `Delete “${p.name}” for both of you?` + (n ? ` Its ${n} saved price${n===1?"":"s"} will be removed from your price history.` : "") + (onTrip ? " It will also come off this trip." : "") + " This can't be undone.";
    c.querySelector('[data-a="no"]').onclick = () => { ui.confirming = null; cf.innerHTML = ""; };
    c.querySelector('[data-a="yes"]').onclick = () => { deleteProduct(pid); closeEditor(); ui.confirming = null; touch(); render(); };
    cf.innerHTML = ""; cf.appendChild(c);
  };
  ed.querySelector('[data-a="del"]').onclick = () => { ui.confirming = "del:" + pid; showConfirm(); };
  if (ui.confirming === "del:" + pid) showConfirm();
  return ed;
}

/* ===== STORES ===== */
function openStores(){ ui.backTab = ["list","shop"].includes(ui.tab) ? ui.tab : "list"; ui.tab = "stores"; closeEditor(); ui.confirming = null; save(); render(); $("main").scrollTop = 0; }
function renderStores(main){
  backButton(main);
  main.appendChild(el(`<h2 style="margin:6px 0 2px;font-size:1.2rem">Stores</h2>`));
  main.appendChild(el(`<div class="hint" style="margin-top:0">Rename a store any time. The new name shows up for both of you. Choose <b>Pay as one total</b> for places like the palengke: you just tick items there and type what you paid in total.</div>`));
  const box = el(`<div class="card"></div>`);
  state.stores.forEach(s => {
    const used = state.products.filter(p => p.stores.includes(s.id)).length;
    const r = el(`<div class="storeedit"><input aria-label="Store name"><button class="ghost danger" type="button">Remove</button></div>`);
    const inp = r.querySelector("input"); inp.id = "st-" + s.id; inp.value = s.name;
    inp.onchange = () => { const v = inp.value.trim(); const cur = state.stores.find(x=>x.id===s.id); if (v && cur) { cur.name = v; touch(); render(); } else inp.value = s.name; };
    r.querySelector("button").onclick = () => { ui.confirming = "store:" + s.id; render(); };
    box.appendChild(r);
    const lt = pickRow([["item","Price each item"],["lump","Pay as one total"]], () => s.lump ? "lump" : "item", v => { const cur = state.stores.find(x=>x.id===s.id); if (cur) { cur.lump = v === "lump"; touch(); render(); } });
    lt.style.margin = "6px 0 10px"; box.appendChild(lt);
    if (ui.confirming === "store:" + s.id) {
      const c = el(`<div class="warnbox"><div></div><div class="form-foot"><button class="ghost" type="button" data-a="no">Keep it</button><button class="primary" type="button" data-a="yes" style="background:var(--danger);color:#fff">Remove store</button></div></div>`);
      c.firstChild.textContent = `Remove ${s.name}?` + (used ? ` ${used} saved item${used===1?"":"s"} list it as a place to buy. They'll keep their other stores.` : "") + " Past prices stay in your history.";
      c.querySelector('[data-a="no"]').onclick = () => { ui.confirming = null; render(); };
      c.querySelector('[data-a="yes"]').onclick = () => {
        state.stores = state.stores.filter(x=>x.id!==s.id);
        state.products.forEach(p => p.stores = p.stores.filter(x=>x!==s.id));
        ui.confirming = null; validStore(); touch(); render(); };
      box.appendChild(c);
    }
  });
  const add = el(`<form class="storeedit" autocomplete="off" style="margin-top:12px"><input id="st-new" placeholder="New store, e.g. S&R" aria-label="New store name"><button class="primary" type="submit">Add store</button></form>`);
  add.onsubmit = e => { e.preventDefault(); const i = add.querySelector("input"); const v = i.value.trim(); if (!v) return;
    if (state.stores.some(s => norm(s.name) === norm(v))) { i.setCustomValidity("You already have a store with this name."); i.reportValidity(); i.oninput = () => i.setCustomValidity(""); return; }
    state.stores.push({id:uid(), name:v}); touch(); render(); $("st-new")?.focus(); };
  box.appendChild(add);
  main.appendChild(box);
}

/* ===== shell ===== */
/* tab colors: the page and the phone's status bar follow the open tab */
const TAB_BAR = {list:["#8ad11f","#0b1b20"], shop:["#ffcf1f","#1b190b"], prices:["#0f97a8","#08191d"]};
function setTabColor(t){
  if (document.body.dataset.tab === t) return;
  document.body.dataset.tab = t;
  const m = document.querySelectorAll('meta[name="theme-color"]'), th = document.documentElement.dataset.theme;
  if (m[0]) m[0].setAttribute("content", TAB_BAR[t][th === "dark" ? 1 : 0]);
  if (m[1]) m[1].setAttribute("content", TAB_BAR[t][th === "light" ? 0 : 1]);
}
function render(){
  const main = $("main"); const st = main.scrollTop; clearInterval(rotTimer);
  document.querySelectorAll(".app > .fab").forEach(x => x.remove()); main.classList.remove("withfab");
  const a = document.activeElement, keep = a && a.id && main.contains(a) ? {id:a.id, s:a.selectionStart, e:a.selectionEnd} : null;
  main.innerHTML = "";
  if (SYNC && !sync.ready) { $("tabs").hidden = true; $("foot").hidden = true; $("tripWrap").hidden = true; setTabColor("list"); renderGate(main); return; }
  const inTrip = !!state.trip;
  if (!inTrip && (ui.tab === "list" || ui.tab === "shop" || ui.tab === "summary")) ui.tab = "list";
  setTabColor(["shop","prices"].includes(ui.tab) && state.trip ? ui.tab : (ui.tab === "prices" ? "prices" : "list"));
  const showHome = !inTrip && ui.tab === "list";
  $("tabs").hidden = !inTrip;
  $("foot").hidden = !inTrip || ui.tab === "summary";
  $("tripWrap").hidden = !inTrip;
  if (inTrip) { $("tripDate").textContent = "Trip · " + fmtDate(state.trip.date, true); if (document.activeElement !== $("tripdate")) $("tripdate").value = state.trip.date; }
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab===ui.tab));
  if (showHome) renderHome(main);
  else if (ui.tab==="prices") renderPrices(main);
  else if (ui.tab==="items") renderItems(main);
  else if (ui.tab==="stores") renderStores(main);
  else if (ui.tab==="shop") renderShop(main);
  else if (ui.tab==="summary") renderSummary(main);
  else renderList(main);
  main.scrollTop = st;
  if (keep) { const n = $(keep.id); if (n && document.activeElement !== n) { try { n.focus({preventScroll:true}); if (keep.s != null) n.setSelectionRange(keep.s, keep.e); } catch(e){} } }
  if (sync.pending && !busy()) setTimeout(applyRemote, 0);
  if (inTrip) {
    const items = tItems(), got = items.filter(i=>i.bought);
    const pcs = items.reduce((a,i)=>a + (isKg(prod(i.pid)) ? 1 : qtyOf(i)), 0);
    const budget = items.reduce((a,i)=>a + (i.est||0), 0);
    $("total").textContent = peso(got.reduce((a,i)=>a+lineTotal(i),0) + lumpTotal());
    $("prog").textContent = `${got.length} of ${items.length} in the cart`;
    $("bud").textContent = budget ? `Budget ${peso0(budget)}` : "";
    $("barFill").style.width = items.length ? (got.length/items.length*100)+"%" : "0%";
    // tally marks in groups of five (a bar instead for long lists)
    const tl = $("tally"), useTally = items.length > 0 && items.length <= 30;
    $("barWrap").hidden = useTally; tl.innerHTML = "";
    if (useTally) { for (let g = 0; g < items.length; g += 5) { const grp = document.createElement("span"); for (let k = g; k < Math.min(g + 5, items.length); k++) { const m = document.createElement("i"); if (k < got.length) m.className = "on"; grp.appendChild(m); } tl.appendChild(grp); } tl.setAttribute("aria-label", $("prog").textContent); }
    document.documentElement.style.setProperty("--foot-h", ($("foot").offsetHeight || 96) + "px");
  }
}
function setTab(t){ ui.tab=t; closeEditor(); ui.confirming=null; if (t!=="prices") ui.product=null; ui.backTab = t; save(); render(); $("main").scrollTop=0; }
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
// tap the date at the top to change it; the date box sits invisibly over the label so the phone's own date picker opens
$("tripdate").onchange = () => { const v = $("tripdate").value; if (v && state.trip) { state.trip.date = v; touch(); render(); } else if (state.trip) $("tripdate").value = state.trip.date; };
$("main").addEventListener("focusout", () => setTimeout(() => { if (sync.pending && !busy()) applyRemote(); }, 0));
/* light / dark: Auto follows the phone; the choice is saved on this phone only */
const THEMES = ["auto","light","dark"];
const THEME_TXT = {auto:"Auto: follows your phone", light:"Light mode", dark:"Dark mode"};
const THEME_ICON = {
  auto:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path class="fill" d="M12 4a8 8 0 0 1 0 16z"/></svg>',
  light:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'};
function getTheme(){ try { const t = localStorage.getItem("palengke-theme"); return THEMES.includes(t) ? t : "auto"; } catch(e){ return "auto"; } }
function applyTheme(t){
  if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  try { localStorage.setItem("palengke-theme", t); } catch(e){}
  const b = $("themeBtn"); b.innerHTML = THEME_ICON[t]; b.setAttribute("aria-label", THEME_TXT[t] + ". Tap to change");
  document.body.dataset.tab = "";          // so the status bar color is set again for the new mode
}
$("themeBtn").onclick = () => { const t = THEMES[(THEMES.indexOf(getTheme()) + 1) % THEMES.length]; applyTheme(t); render(); toast(THEME_TXT[t]); };
applyTheme(getTheme());
startSync();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
