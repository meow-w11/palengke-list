<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a4d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>Palengke List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one screen. Home = single start button. During a trip: tabs (List / Shop / Prices), scrolling content, trip total docked at the bottom */
:root{
  --bg:#f3f6f1; --surface:#ffffff; --fg:#17231b; --muted:#5f6f64; --line:#dbe3d8;
  --accent:#1f7a4d; --accent-ink:#ffffff; --soft:#e3efe5; --danger:#b4412f; --warn:#8a5308; --warn-soft:#fbefd9;
  --up:#b4412f; --down:#1f7a4d; --bar:#2e8b5c; --bar-hi:#17603c; --grid:#e6ece4;
  --display:"Familjen Grotesk", "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Roboto Mono", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1712; --surface:#17211a; --fg:#e7efe8; --muted:#93a598; --line:#26332a;
  --accent:#4cc38a; --accent-ink:#06130b; --soft:#1c3226; --danger:#ef7a66; --warn:#f2b45a; --warn-soft:#3a2c14;
  --up:#ef7a66; --down:#4cc38a; --bar:#3fae78; --bar-hi:#7fdcab; --grid:#223028; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1712; --surface:#17211a; --fg:#e7efe8; --muted:#93a598; --line:#26332a;
  --accent:#4cc38a; --accent-ink:#06130b; --soft:#1c3226; --danger:#ef7a66; --warn:#f2b45a; --warn-soft:#3a2c14;
  --up:#ef7a66; --down:#4cc38a; --bar:#3fae78; --bar-hi:#7fdcab; --grid:#223028; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);margin:0}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.pad{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
header{padding-block:14px 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
h1{font-size:1.35rem;margin:0;letter-spacing:-.01em}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.tabs button{padding:9px 0;border-radius:9px;background:none;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
main{flex:1;overflow-y:auto;min-height:0;padding-block:8px 16px}
input{font:inherit;font-size:16px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;width:100%;box-sizing:border-box}
input.num{font-family:var(--mono);text-align:right}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;color:var(--fg)}
.primary{background:var(--accent);color:var(--accent-ink);border-radius:10px;font-weight:700;padding:10px 14px}
.ghost{background:none;color:var(--accent);font-size:.82rem;padding:6px 0;text-decoration:underline}
.danger{color:var(--danger)}
.note{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:8px 12px;margin-top:8px}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:.9rem;line-height:1.5}
.label{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.label b{font-family:var(--mono);letter-spacing:0;color:var(--fg)}
.hint{font-size:.72rem;color:var(--muted);margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--fg)}
.form-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
/* home */
.home{display:flex;flex-direction:column;justify-content:center;min-height:100%;gap:14px;padding-block:24px}
.start{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:28px 20px;font-size:1.5rem;font-weight:700;text-align:left;display:flex;justify-content:space-between;align-items:center}
.start small{display:block;font-size:.85rem;font-weight:500;opacity:.85;margin-top:4px}
.start .arrow{font-size:2rem}
.homelinks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.homelinks button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.homelinks .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.homelinks .v{font-family:var(--mono);font-weight:700;margin-top:4px;font-size:1.05rem}
/* suggestions */
.suggest{border:1px solid var(--line);border-radius:10px;margin-top:6px;overflow:hidden;background:var(--surface)}
.sg{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:10px 12px;background:none;border-bottom:1px solid var(--line)}
.sg:last-child{border-bottom:0}
.sg .meta{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.sg.new{color:var(--accent);font-weight:700}
.usual{display:flex;flex-wrap:wrap;gap:6px}
.usual button{border:1px dashed var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem}
.usual button::before{content:"+ ";color:var(--accent);font-weight:700}
/* rows */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li-main{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 12px;width:100%;text-align:left;background:none}
.nm{min-width:0;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:.68rem;background:var(--soft);color:var(--muted);border-radius:6px;padding:2px 6px}
.last{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-align:right;white-space:nowrap}
.li.bought .t{color:var(--muted);text-decoration:line-through}
.edit{padding:0 12px 12px}
/* shop */
.storebar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.storebar::-webkit-scrollbar{display:none}
.store{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:left;min-width:86px}
.store .s-nm{font-weight:700;font-size:.9rem;display:block}
.store .s-left{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.store[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.store[aria-pressed="true"] .s-left{color:var(--accent-ink);opacity:.85}
.store.done:not([aria-pressed="true"]) .s-left{color:var(--accent)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden}
.item-main{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:12px;width:100%;text-align:left;background:none}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:.85rem}
.item.in .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item.in .t{color:var(--muted);text-decoration:line-through}
.item.other{border-style:dashed}
.paid{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.editor{display:grid;grid-template-columns:1fr auto;gap:6px;padding:0 12px 12px}
.editor .actions{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.82rem;margin-top:10px;line-height:1.4}
details summary{cursor:pointer;color:var(--muted);font-size:.82rem;margin-top:18px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.82rem;margin-top:10px;line-height:1.4}
/* prices */
.prow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 12px;width:100%;text-align:left;background:none}
.chg{font-family:var(--mono);font-size:.72rem}
.chg.up{color:var(--up)} .chg.down{color:var(--down)} .chg.flat{color:var(--muted)}
.big{font-family:var(--mono);font-weight:700;font-size:1.05rem;text-align:right;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block;touch-action:manipulation}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.chart .lbl{fill:var(--fg);font-weight:700}
.chart rect.b{fill:var(--bar)}
.chart rect.b.sel{fill:var(--bar-hi)}
.chart line{stroke:var(--grid)}
.readout{font-family:var(--mono);font-size:.82rem;min-height:1.3em;margin-bottom:4px}
.readout span{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
td.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.d{color:var(--muted);font-family:var(--mono);font-size:.75rem;white-space:nowrap}
.back{background:none;color:var(--accent);font-weight:700;padding:6px 0}
footer{background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px}
footer .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
footer .tot{font-family:var(--mono);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums}
footer .right{text-align:right;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.bar{height:6px;background:var(--soft);border-radius:4px;margin-top:6px;width:120px;overflow:hidden;margin-left:auto}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.storeedit{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:6px}
</style>
</head>
<body>


<div class="app">
  <header class="pad" id="hdr">
    <div class="top"><h1>Palengke List</h1><span id="tripDate" class="hint" style="margin:0"></span></div>
    <div class="tabs" role="tablist" id="tabs">
      <button data-tab="list" role="tab" type="button">List</button>
      <button data-tab="shop" role="tab" type="button">Shop</button>
      <button data-tab="prices" role="tab" type="button">Prices</button>
    </div>
  </header>
  <main class="pad" id="main"></main>
  <footer class="pad" id="foot">
    <div>
      <div class="lbl">Spent this trip</div>
      <div class="tot" id="total">₱0.00</div>
    </div>
    <div>
      <div class="right" id="prog">0 of 0 items</div>
      <div class="bar"><i id="barFill" style="width:0%"></i></div>
    </div>
  </footer>
</div>

<script>
/* ===== helpers ===== */
const peso = n => "₱" + (Math.round(n*100)/100).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const peso0 = n => "₱" + Math.round(n).toLocaleString("en-PH");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const norm = s => s.trim().toLowerCase().replace(/\s+/g," ");
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtDate = (iso, long) => new Date(iso+"T00:00:00").toLocaleDateString("en-PH", long ? {month:"short",day:"numeric",year:"numeric"} : {month:"short",day:"numeric"});
const $ = id => document.getElementById(id);
const el = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===== data =====
   stores:   [{id,name}]
   products: [{id,name,stores:[storeId,…]}]          ← saved for good, reused every trip
   trip:     {date, items:[{pid, skip:[], bought:{store,price}|null}]} | null
   history:  [{id,date,items:[{pid,store,price}]}]   ← one entry per finished trip */
const KEY = "palengke-v5";
const DEFAULT_STORES = [{id:"mall",name:"Mall"},{id:"mng",name:"MnG"},{id:"palengke",name:"Palengke"},{id:"korean",name:"Korean store"}];
function sampleData(){
  const P = [["p1","Chicken thighs (1 kg)",["mall","mng"]],["p2","Pork belly (½ kg)",["mall","mng"]],["p3","Tofu",["korean","palengke"]],
             ["p4","Kangkong",["palengke"]],["p5","Soy sauce",["mall"]],["p6","Eggs (tray)",["mall","palengke"]]];
  const trips = [["2026-07-11",[["p1","mall",185],["p2","mng",165],["p3","korean",48],["p4","palengke",20],["p6","mall",235]]],
                 ["2026-08-08",[["p1","mng",188],["p2","mng",170],["p3","palengke",45],["p5","mall",42],["p6","mall",240]]],
                 ["2026-09-05",[["p1","mall",195],["p2","mall",182],["p3","korean",52],["p4","palengke",25],["p6","palengke",238]]],
                 ["2026-10-03",[["p1","mng",205],["p2","mng",185],["p3","korean",55],["p4","palengke",25],["p5","mall",45],["p6","mall",250]]]];
  return {sample:true, stores:JSON.parse(JSON.stringify(DEFAULT_STORES)),
    products:P.map(([id,name,stores])=>({id,name,stores})),
    history:trips.map(([date,items],i)=>({id:"h"+i,date,items:items.map(([pid,store,price])=>({pid,store,price}))})),
    trip:null};
}
let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch(e){ state = null; }
if (!state || !Array.isArray(state.products)) state = migrate() || sampleData();
function migrate(){
  let v4=null; try { v4 = JSON.parse(localStorage.getItem("palengke-v4")); } catch(e){}
  if (!v4 || v4.sample || !Array.isArray(v4.items) || !v4.items.length) return null;
  const s = {sample:false, stores:v4.stores||JSON.parse(JSON.stringify(DEFAULT_STORES)), products:[], history:[], trip:{date:today(),items:[]}};
  v4.items.forEach(i => {
    let p = s.products.find(x => norm(x.name)===norm(i.name));
    if (!p) { p = {id:uid(), name:i.name.trim(), stores:i.stores||[]}; s.products.push(p); }
    if (!s.trip.items.some(t=>t.pid===p.id)) s.trip.items.push({pid:p.id, skip:i.skip||[], bought:i.bought||null});
  });
  return s;
}
let ui = {tab:"list", store:null, editing:null, confirming:null, addStores:[], editStores:false, product:null, query:"", sel:null, openOthers:false};
try { Object.assign(ui, JSON.parse(localStorage.getItem(KEY+"-ui")) || {}); } catch(e){}
Object.assign(ui, {editing:null, confirming:null, editStores:false, query:"", sel:null});
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); localStorage.setItem(KEY+"-ui", JSON.stringify({tab:ui.tab,store:ui.store,addStores:ui.addStores,product:ui.product})); } catch(e){} };
const touch = () => { save(); };
const prod = pid => state.products.find(p=>p.id===pid);
const storeName = id => state.stores.find(s=>s.id===id)?.name || "Removed store";
if (!state.stores.some(s=>s.id===ui.store)) ui.store = state.stores[0]?.id || null;

/* price history for a product, oldest → newest; */
function purchases(pid){
  const out = [];
  state.history.forEach(h => h.items.forEach(it => { if (it.pid===pid) out.push({date:h.date, store:it.store, price:it.price, hid:h.id}); }));
  out.sort((a,b)=>a.date.localeCompare(b.date));
  return out;
}
const lastBuy = pid => { const p = purchases(pid); return p[p.length-1]; };
const timesBought = pid => state.history.reduce((n,h)=>n+(h.items.some(i=>i.pid===pid)?1:0),0);

/* trip helpers */
const tItems = () => state.trip ? state.trip.items : [];
const options = ti => { const p = prod(ti.pid); return ((p && p.stores.length) ? p.stores : state.stores.map(s=>s.id)).filter(s => !ti.skip.includes(s)); };
const canBuyAt = (ti, sid) => options(ti).includes(sid);
const leftAt = sid => tItems().filter(i => !i.bought && canBuyAt(i, sid));

function clearSample(){
  if (!state.sample) return;
  state = {sample:false, stores:state.stores, products:[], history:[], trip:state.trip ? {date:today(),items:[]} : null};
}
function sampleNote(main){
  if (!state.sample) return;
  const n = el(`<div class="note"><span>Example data so you can see how it works. Starting your first trip clears it.</span><button class="ghost" type="button">Clear examples</button></div>`);
  n.querySelector("button").onclick = () => { clearSample(); save(); render(); };
  main.appendChild(n);
}

function chipRow(selected, onToggle){
  const row = el(`<div class="chips"></div>`);
  state.stores.forEach(s => {
    const c = el(`<button type="button" class="chip"></button>`);
    c._paint = () => { const i = selected.indexOf(s.id); c.setAttribute("aria-pressed", i>=0);
      c.textContent = (i>=0 ? (i===0 ? "1st · " : "Backup · ") : "") + s.name; };
    c._paint();
    c.onclick = () => { onToggle(s.id); row.querySelectorAll(".chip").forEach(x=>x._paint()); };
    row.appendChild(c);
  });
  return row;
}
function storeTags(p){
  const box = el(`<span class="tags"></span>`);
  (p.stores.length ? p.stores : [null]).forEach((s,i) => { const t = el(`<span class="tag"></span>`); t.textContent = s ? (i ? "or " : "") + storeName(s) : "Any store"; box.appendChild(t); });
  return box;
}

/* ===== HOME ===== */
function renderHome(main){
  const wrap = el(`<div class="home"></div>`);
  if (state.sample) { const n = document.createElement("div"); sampleNote(n); wrap.appendChild(n); }
  const b = el(`<button class="start" type="button"><span>Start listing<small>Plan what to buy for this trip</small></span><span class="arrow">→</span></button>`);
  b.onclick = () => { if (state.sample) clearSample(); state.trip = {date:today(), items:[]}; ui.tab="list"; ui.store = state.stores[0]?.id||null; save(); render(); setTimeout(()=>$("q")?.focus(),50); };
  wrap.appendChild(b);
  const last = state.history[state.history.length-1];
  const links = el(`<div class="homelinks">
    <button type="button" data-go="prices"><div class="k">Price history</div><div class="v">${(n=>n+" item"+(n===1?"":"s"))(state.products.filter(p=>purchases(p.id).length).length)}</div></button>
    <button type="button" data-go="prices"><div class="k">Last trip</div><div class="v">${last ? peso0(last.items.reduce((a,i)=>a+i.price,0)) : "—"}</div><div class="hint" style="margin:2px 0 0">${last ? fmtDate(last.date,true) : "No trips yet"}</div></button>
  </div>`);
  links.querySelectorAll("button").forEach(x => x.onclick = () => { ui.tab="prices"; ui.product=null; save(); render(); });
  wrap.appendChild(links);
  main.appendChild(wrap);
}

/* ===== LIST ===== */
function addToTrip(p){
  if (!tItems().some(t=>t.pid===p.id)) state.trip.items.push({pid:p.id, skip:[], bought:null});
}
function renderList(main){
  sampleNote(main);
  const onTrip = new Set(tItems().map(t=>t.pid));
  const box = el(`<div class="card">
    <input id="q" placeholder="Type an item, e.g. Tofu" aria-label="Item to buy" autocomplete="off" enterkeyhint="done">
    <div id="sgBox"></div>
  </div>`);
  const q = box.querySelector("#q"), sgBox = box.querySelector("#sgBox");
  q.value = ui.query;
  const paint = () => {
    sgBox.innerHTML = ""; ui.query = q.value; const v = norm(q.value);
    if (!v) return;
    const exact = state.products.find(p => norm(p.name)===v);
    const matches = state.products.filter(p => norm(p.name).includes(v)).sort((a,b)=>(norm(b.name).startsWith(v)-norm(a.name).startsWith(v)) || timesBought(b.id)-timesBought(a.id)).slice(0,6);
    const list = el(`<div class="suggest"></div>`);
    matches.forEach(p => {
      const lb = lastBuy(p.id);
      const s = el(`<button type="button" class="sg"><span class="nm"></span><span class="meta"></span></button>`);
      s.querySelector(".nm").textContent = p.name;
      s.querySelector(".meta").textContent = onTrip.has(p.id) ? "on list" : (lb ? "last " + peso0(lb.price) : "saved");
      s.onclick = () => { if (!onTrip.has(p.id)) { addToTrip(p); } ui.query=""; touch(); render(); $("q")?.focus(); };
      list.appendChild(s);
    });
    if (!exact) {
      const s = el(`<button type="button" class="sg new"></button>`);
      s.textContent = `+ Add “${q.value.trim()}” as a new item`;
      s.onclick = () => { ui.sel = []; renderNew(); };
      list.appendChild(s);
    }
    sgBox.appendChild(list);
  };
  const renderNew = () => {
    const name = q.value.trim(); if (!name) return;
    const sel = ui.addStores.filter(id => state.stores.some(s=>s.id===id));
    sgBox.innerHTML = "";
    const f = el(`<div style="margin-top:8px"><div class="hint">New item. Where do you buy it? Tap your first choice, then any backups.</div><div class="cs"></div>
      <div class="form-foot"><button class="ghost" type="button" data-a="cancel">Cancel</button><button class="primary" type="button" data-a="ok">Add to list</button></div></div>`);
    f.querySelector(".cs").replaceWith(chipRow(sel, id => { const i=sel.indexOf(id); i>=0?sel.splice(i,1):sel.push(id); ui.addStores=sel.slice(); save(); }));
    f.querySelector('[data-a="cancel"]').onclick = () => paint();
    f.querySelector('[data-a="ok"]').onclick = () => {
      const p = {id:uid(), name, stores:sel.slice()}; state.products.push(p); addToTrip(p);
      ui.query=""; touch(); render(); $("q")?.focus(); };
    sgBox.appendChild(f);
  };
  q.oninput = paint;
  q.onkeydown = e => { if (e.key==="Enter") { e.preventDefault(); const v = norm(q.value); if(!v) return;
    const exact = state.products.find(p => norm(p.name)===v);
    if (exact) { addToTrip(exact); ui.query=""; touch(); render(); $("q")?.focus(); } else renderNew(); } };
  main.appendChild(box);
  paint();

  // usuals: saved products not on this trip, most bought first
  const usual = state.products.filter(p => !onTrip.has(p.id)).sort((a,b)=>timesBought(b.id)-timesBought(a.id) || a.name.localeCompare(b.name));
  if (usual.length) {
    main.appendChild(el(`<div class="label"><span>Saved items · tap to add</span></div>`));
    const u = el(`<div class="usual"></div>`);
    usual.slice(0, ui.showAllUsual ? 999 : 12).forEach(p => {
      const b = el(`<button type="button"></button>`); b.textContent = p.name;
      b.onclick = () => { addToTrip(p); touch(); render(); };
      u.appendChild(b);
    });
    main.appendChild(u);
    if (usual.length > 12) { const m = el(`<button class="ghost" type="button">${ui.showAllUsual?"Show fewer":"Show all "+usual.length}</button>`); m.onclick=()=>{ui.showAllUsual=!ui.showAllUsual;render();}; main.appendChild(m); }
  }

  main.appendChild(el(`<div class="label"><span>This trip · ${tItems().length} item${tItems().length===1?"":"s"}</span></div>`));
  if (!tItems().length) main.appendChild(el(`<div class="empty">Type what you need above, or tap a saved item.</div>`));
  else {
    const rows = el(`<div class="rows"></div>`);
    tItems().forEach(ti => {
      const p = prod(ti.pid); if (!p) return;
      const lb = lastBuy(p.id);
      const r = el(`<div class="li${ti.bought?" bought":""}"><button type="button" class="li-main"><span class="nm"><span class="t"></span></span><span class="last"></span></button></div>`);
      r.querySelector(".t").textContent = p.name;
      r.querySelector(".nm").appendChild(storeTags(p));
      r.querySelector(".last").textContent = ti.bought ? peso(ti.bought.price) : (lb ? "last " + peso0(lb.price) : "");
      r.querySelector(".li-main").onclick = () => { ui.editing = ui.editing===p.id ? null : p.id; render(); };
      if (ui.editing === p.id) r.appendChild(productEditor(p, ti));
      rows.appendChild(r);
    });
    main.appendChild(rows);
  }

  // stores
  const sl = el(`<div class="label"><span>Stores</span></div>`);
  const tg = el(`<button class="ghost" type="button" style="padding:0;font-size:.72rem;letter-spacing:0;text-transform:none">${ui.editStores?"Done":"Edit stores"}</button>`);
  tg.onclick = () => { ui.editStores = !ui.editStores; render(); };
  sl.appendChild(tg); main.appendChild(sl);
  if (ui.editStores) {
    const sb = el(`<div class="card" style="margin-top:0"></div>`);
    state.stores.forEach(s => {
      const r = el(`<div class="storeedit"><input aria-label="Store name"><button class="ghost danger" type="button">Remove</button></div>`);
      const inp = r.querySelector("input"); inp.value = s.name;
      inp.onchange = () => { const v = inp.value.trim(); if (v) { s.name = v; touch(); render(); } };
      r.querySelector("button").onclick = () => {
        state.stores = state.stores.filter(x=>x!==s);
        state.products.forEach(p => p.stores = p.stores.filter(x=>x!==s.id));
        if (ui.store===s.id) ui.store = state.stores[0]?.id || null;
        touch(); render(); };
      sb.appendChild(r);
    });
    const add = el(`<form class="storeedit" autocomplete="off"><input placeholder="New store, e.g. S&R" aria-label="New store name"><button class="primary" type="submit">Add</button></form>`);
    add.onsubmit = e => { e.preventDefault(); const v = add.querySelector("input").value.trim(); if(!v) return; state.stores.push({id:uid(),name:v}); touch(); render(); };
    sb.appendChild(add); main.appendChild(sb);
  } else main.appendChild(el(`<div class="hint" style="margin-top:0">${state.stores.map(s=>esc(s.name)).join(" · ")}</div>`));

  if (tItems().length) { const go = el(`<button class="primary" type="button" style="width:100%;margin-top:18px">Go shopping →</button>`); go.onclick = () => setTab("shop"); main.appendChild(go); }
  cancelTripControl(main);
}

function productEditor(p, ti){
  const sel = p.stores.slice();
  const ed = el(`<form class="edit" autocomplete="off">
    <input aria-label="Item name">
    <div class="hint">Changes are saved to this item for every trip.</div>
    <div class="cs"></div>
    <div class="form-foot"><button class="ghost danger" type="button" data-a="rm">Remove from this trip</button>
      <span style="display:flex;gap:12px;align-items:center"><button class="ghost" type="button" data-a="cancel">Cancel</button><button class="primary" type="submit">Save</button></span></div>
  </form>`);
  const n = ed.querySelector("input"); n.value = p.name;
  ed.querySelector(".cs").replaceWith(chipRow(sel, id => { const i=sel.indexOf(id); i>=0?sel.splice(i,1):sel.push(id); }));
  ed.onsubmit = e => { e.preventDefault(); const v = n.value.trim(); if (!v) return;
    const dup = state.products.find(x => x!==p && norm(x.name)===norm(v));
    if (dup) { n.setCustomValidity("You already have an item with this name."); n.reportValidity(); n.oninput=()=>n.setCustomValidity(""); return; }
    p.name = v; p.stores = sel; ui.editing=null; touch(); render(); };
  ed.querySelector('[data-a="cancel"]').onclick = () => { ui.editing=null; render(); };
  ed.querySelector('[data-a="rm"]').onclick = () => { state.trip.items = state.trip.items.filter(x=>x!==ti); ui.editing=null; touch(); render(); };
  return ed;
}

/* ===== SHOP ===== */
function shopItem(ti, sid, kind){
  const p = prod(ti.pid); const inCart = !!ti.bought; const lb = lastBuy(p.id);
  const card = el(`<div class="item${inCart?" in":""}${kind==="other"?" other":""}">
    <button class="item-main" type="button">
      <span class="box">${inCart?"✓":""}</span>
      <span class="nm"><span class="t"></span><span class="tags"></span></span>
      <span class="${inCart?"paid":"last"}">${inCart ? peso(ti.bought.price) : (lb ? "last "+peso0(lb.price) : "add price")}</span>
    </button></div>`);
  card.querySelector(".t").textContent = p.name;
  const tags = card.querySelector(".tags");
  if (kind==="here" && options(ti)[0] !== sid) tags.appendChild(el(`<span class="tag">backup here</span>`));
  if (kind==="other") { if (ti.skip.includes(sid)) tags.appendChild(el(`<span class="tag">marked not available here</span>`));
    options(ti).forEach(s => { const t = el(`<span class="tag"></span>`); t.textContent = storeName(s); tags.appendChild(t); }); }
  card.querySelector(".item-main").onclick = () => { ui.editing = ui.editing===p.id ? null : p.id; render(); };
  if (ui.editing === p.id) {
    const ed = el(`<form class="editor" autocomplete="off">
      <input class="num" type="number" inputmode="decimal" min="0" step="any" aria-label="Price paid for ${esc(p.name)}">
      <button class="primary" type="submit">${inCart?"Update":"In cart"}</button>
      <div class="actions">${inCart?'<button class="ghost danger" type="button" data-a="out">Take out of cart</button>':(kind==="here"?'<button class="ghost danger" type="button" data-a="na">Not available here</button>':'<span></span>')}
      <button class="ghost" type="button" data-a="cancel">Cancel</button></div></form>`);
    const inp = ed.querySelector("input");
    inp.placeholder = lb ? `Price (last ${peso0(lb.price)})` : "Price, ₱";
    if (inCart) inp.value = ti.bought.price;
    ed.onsubmit = e => { e.preventDefault(); const v = parseFloat(inp.value);
      if (!Number.isFinite(v)) { inp.setCustomValidity("Enter the price on the tag."); inp.reportValidity(); inp.oninput=()=>inp.setCustomValidity(""); return; }
      ti.bought = {store: inCart ? ti.bought.store : sid, price: v}; ui.editing=null; touch(); render(); };
    ed.querySelector('[data-a="cancel"]').onclick = () => { ui.editing=null; render(); };
    const na = ed.querySelector('[data-a="na"]'); if (na) na.onclick = () => { if (!ti.skip.includes(sid)) ti.skip.push(sid); ui.editing=null; touch(); render(); };
    const out = ed.querySelector('[data-a="out"]'); if (out) out.onclick = () => { ti.bought=null; ui.editing=null; touch(); render(); };
    card.appendChild(ed);
    setTimeout(()=>inp.focus(),0);
  }
  return card;
}

function renderShop(main){
  if (!tItems().length) { main.appendChild(el(`<div class="empty">Nothing on this trip yet. Add items in List first.</div>`)); return; }
  if (!state.stores.length) { main.appendChild(el(`<div class="empty">Add a store in List → Edit stores.</div>`)); return; }
  const sid = ui.store;
  const bar = el(`<div class="storebar" role="group" aria-label="Which store are you at?"></div>`);
  state.stores.forEach(s => {
    const n = leftAt(s.id).length;
    const b = el(`<button type="button" class="store${n?"":" done"}" aria-pressed="${s.id===sid}"><span class="s-nm"></span><span class="s-left">${n ? n+" left" : "✓ done"}</span></button>`);
    b.querySelector(".s-nm").textContent = s.name;
    b.onclick = () => { ui.store = s.id; ui.editing=null; save(); render(); $("main").scrollTop = 0; };
    bar.appendChild(b);
  });
  main.appendChild(bar);

  const here = leftAt(sid);
  const boughtHere = tItems().filter(i => i.bought && i.bought.store===sid);
  main.appendChild(el(`<div class="label"><span>To buy at ${esc(storeName(sid))} · ${here.length}</span></div>`));
  if (!here.length) main.appendChild(el(`<div class="empty" style="padding:12px 8px">Nothing left to buy here.</div>`));
  here.forEach(ti => main.appendChild(shopItem(ti, sid, "here")));

  if (boughtHere.length) {
    main.appendChild(el(`<div class="label"><span>In cart from ${esc(storeName(sid))} · ${boughtHere.length}</span><b>${peso(boughtHere.reduce((a,i)=>a+i.bought.price,0))}</b></div>`));
    boughtHere.forEach(ti => main.appendChild(shopItem(ti, sid, "cart")));
  }
  const others = tItems().filter(i => !i.bought && !canBuyAt(i, sid));
  if (others.length) {
    const d = el(`<details><summary>Found something from another store here? (${others.length})</summary></details>`);
    d.open = ui.openOthers; d.ontoggle = () => { ui.openOthers = d.open; };
    others.forEach(ti => d.appendChild(shopItem(ti, sid, "other")));
    main.appendChild(d);
  }
  const onlyHere = here.filter(i => { const o = options(i); return o.length===1 && o[0]===sid; });
  if (onlyHere.length && boughtHere.length)
    main.appendChild(el(`<div class="warnbox">Before you leave ${esc(storeName(sid))}: ${onlyHere.length} item${onlyHere.length===1?" is":"s are"} only on your list for this store (${onlyHere.map(i=>esc(prod(i.pid).name)).join(", ")}).</div>`));
  const stranded = tItems().filter(i => !i.bought && !options(i).length);
  if (stranded.length) main.appendChild(el(`<div class="warnbox">No store left for: ${stranded.map(i=>esc(prod(i.pid).name)).join(", ")}. Add another store to ${stranded.length===1?"it":"them"} in List.</div>`));

  // finish trip
  const wrap = el(`<div style="margin-top:22px"></div>`);
  const got = tItems().filter(i=>i.bought), notGot = tItems().length - got.length;
  if (ui.confirming === "finish") {
    const c = el(`<div class="card"><div class="confirm" style="margin:0">
      <span>Finish this trip? ${got.length} price${got.length===1?"":"s"} will be saved to your price history.${notGot?` ${notGot} item${notGot===1?"":"s"} you didn't buy will be dropped.`:""}</span>
      <button class="primary" type="button" data-a="ok">Finish and save</button><button class="ghost" type="button" data-a="cancel">Cancel</button></div></div>`);
    c.querySelector('[data-a="ok"]').onclick = () => {
      if (got.length) state.history.push({id:uid(), date:state.trip.date, items:got.map(i=>({pid:i.pid, store:i.bought.store, price:i.bought.price}))});
      state.trip = null; ui.confirming=null; ui.tab="list"; touch(); render(); };
    c.querySelector('[data-a="cancel"]').onclick = () => { ui.confirming=null; render(); };
    wrap.appendChild(c);
  } else {
    const b = el(`<button class="primary" type="button" style="width:100%">Finish trip</button>`);
    b.onclick = () => { ui.confirming="finish"; render(); $("main").scrollTop = 1e6; };
    wrap.appendChild(b);
  }
  main.appendChild(wrap);
}

function cancelTripControl(main){
  const w = el(`<div style="margin-top:14px"></div>`);

    const c = el(`<div class="confirm"><span>Cancel this trip without saving any prices? Your saved items stay.</span><button class="primary" type="button" data-a="ok">Cancel trip</button><button class="ghost" type="button" data-a="no">Keep going</button></div>`);

/* ===== PRICES ===== */
function barChart(points, onPick, picked){
  // points: [{label, value}] oldest→newest, one series, one y-axis from 0
  const W = 340, H = 170, L = 8, R = 8, T = 22, B = 22;
  const max = Math.max(...points.map(p=>p.value)) || 1;
  const step = niceStep(max / 3); const top = Math.ceil(max/step)*step;
  const n = points.length, slot = (W-L-R)/n, bw = Math.min(36, slot*0.62);
  const y = v => T + (H-T-B) * (1 - v/top);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price over time">`;
  for (let g=0; g<=top+1e-9; g+=step) s += `<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke-width="1"/>`;
  points.forEach((p,i) => {
    const cx = L + slot*i + slot/2, yy = y(p.value), h = (H-B) - yy, x = cx-bw/2, r = Math.min(4, bw/2, h);
    const path = `M${x},${H-B} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${H-B} Z`;
    s += `<path d="${path}" class="b${i===picked?" sel":""}" style="fill:var(${i===picked?"--bar-hi":"--bar"})"/>`;
    s += `<rect x="${L+slot*i}" y="0" width="${slot}" height="${H}" fill="transparent" data-i="${i}" style="cursor:pointer"/>`;
    if (i===0 || i===n-1 || i===picked) s += `<text class="lbl" x="${cx}" y="${yy-6}" text-anchor="middle">${esc(peso0(p.value))}</text>`;
    if (n<=8 || i%Math.ceil(n/8)===0 || i===n-1) s += `<text x="${cx}" y="${H-6}" text-anchor="middle">${esc(p.label)}</text>`;
  });
  s += `</svg>`;
  const wrap = el(`<div>${s}</div>`);
  wrap.querySelectorAll("rect[data-i]").forEach(r => r.onclick = () => onPick(+r.dataset.i));
  return wrap;
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x||1))); const f = x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function changeTag(first, last){
  if (first==null || last==null || first===0) return `<span class="chg flat">—</span>`;
  const pct = (last-first)/first*100;
  const cls = pct>0.5 ? "up" : pct<-0.5 ? "down" : "flat";
  return `<span class="chg ${cls}">${pct>0?"▲ +":pct<0?"▼ ":""}${Math.round(pct)}%</span>`;
}

function renderPrices(main){
  sampleNote(main);
  if (ui.product && prod(ui.product)) return renderProduct(main, prod(ui.product));
  ui.product = null;
  if (!state.trip) { const b = el(`<button class="back" type="button">← Home</button>`); b.onclick=()=>{ui.tab="list";render();}; main.appendChild(b); }

  // trip totals
  const trips = state.history.slice().sort((a,b)=>a.date.localeCompare(b.date));
  if (!trips.length) { main.appendChild(el(`<div class="empty">No finished trips yet. When you tap <b>Finish trip</b> in Shop, the prices you paid are saved here, and each item gets its own price chart.</div>`)); return; }
  main.appendChild(el(`<div class="label"><span>Spent per trip</span><span>${trips.length} trip${trips.length===1?"":"s"}</span></div>`));
  const tc = el(`<div class="card" style="margin-top:0"><div class="readout" id="tripRead"></div></div>`);
  const pts = trips.slice(-12).map(t => ({label:fmtDate(t.date), value:t.items.reduce((a,i)=>a+i.price,0), t}));
  const pickTrip = i => { const p = pts[i]; tc.querySelector("#tripRead").innerHTML = `${esc(fmtDate(p.t.date,true))} <span>·</span> ${esc(peso(p.value))} <span>· ${p.t.items.length} item${p.t.items.length===1?"":"s"}</span>`;
    const old = tc.querySelector("div:not(.readout)"); const nw = barChart(pts, pickTrip, i); old ? old.replaceWith(nw) : tc.appendChild(nw); };
  tc.appendChild(barChart(pts, pickTrip, pts.length-1)); main.appendChild(tc); pickTrip(pts.length-1);
  main.appendChild(el(`<div class="hint">Trip totals depend on what you bought each time. For inflation, check each item below.</div>`));

  // items
  const items = state.products.map(p => ({p, buys:purchases(p.id)})).filter(x=>x.buys.length)
    .sort((a,b)=>b.buys.length-a.buys.length || a.p.name.localeCompare(b.p.name));
  main.appendChild(el(`<div class="label"><span>Items · change since first price</span></div>`));
  const rows = el(`<div class="rows"></div>`);
  items.forEach(({p,buys}) => {
    const first = buys[0], last = buys[buys.length-1];
    const r = el(`<div class="li"><button type="button" class="prow"><span class="nm"><span class="t"></span><span class="tags"><span class="tag">${buys.length} purchase${buys.length===1?"":"s"}</span></span></span>
      <span><div class="big">${esc(peso0(last.price))}</div><div style="text-align:right">${changeTag(buys.length>1?first.price:null,last.price)}</div></span></button></div>`);
    r.querySelector(".t").textContent = p.name;
    r.querySelector("button").onclick = () => { ui.product = p.id; save(); render(); $("main").scrollTop=0; };
    rows.appendChild(r);
  });
  main.appendChild(rows);
  backupControls(main);
}

function renderProduct(main, p){
  const b = el(`<button class="back" type="button">← All items</button>`); b.onclick = () => { ui.product=null; save(); render(); }; main.appendChild(b);
  const buys = purchases(p.id);
  const head = el(`<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:6px"><h2 style="margin:0;font-size:1.25rem;min-width:0;overflow-wrap:anywhere"></h2><div></div></div>`);
  head.querySelector("h2").textContent = p.name;
  if (buys.length) head.lastChild.innerHTML = `<div class="big">${esc(peso(buys[buys.length-1].price))}</div><div style="text-align:right">${buys.length>1 ? changeTag(buys[0].price, buys[buys.length-1].price)+` <span class="hint">since ${esc(fmtDate(buys[0].date))}</span>` : `<span class="hint">first price</span>`}</div>`;
  main.appendChild(head);
  if (!buys.length) { main.appendChild(el(`<div class="empty">No prices saved for this item yet.</div>`)); return; }
  const pts = buys.slice(-16).map(x => ({label:fmtDate(x.date), value:x.price, x}));
  const card = el(`<div class="card"><div class="readout"></div></div>`);
  const pick = i => { const x = pts[i].x; card.querySelector(".readout").innerHTML = `${esc(fmtDate(x.date,true))} <span>·</span> ${esc(peso(x.price))} <span>at ${esc(storeName(x.store))}</span>`;
    const old = card.querySelector("div:not(.readout)"); const nw = barChart(pts, pick, i); old ? old.replaceWith(nw) : card.appendChild(nw); };
  card.appendChild(barChart(pts, pick, pts.length-1)); main.appendChild(card); pick(pts.length-1);
  main.appendChild(el(`<div class="hint">Tap a bar to see the date and store. Keep the size in the item name (like “1 kg”) so prices compare fairly.</div>`));

  // cheapest by store
  const byStore = {};
  buys.forEach(x => { (byStore[x.store] ||= []).push(x); });
  if (Object.keys(byStore).length > 1) {
    main.appendChild(el(`<div class="label"><span>Latest price by store</span></div>`));
    const t = el(`<table></table>`);
    Object.entries(byStore).map(([s,xs]) => [s, xs[xs.length-1]]).sort((a,b)=>a[1].price-b[1].price).forEach(([s,x],i) => {
      const tr = el(`<tr><td></td><td class="d">${esc(fmtDate(x.date))}</td><td class="r">${esc(peso(x.price))}${i===0?' <span class="chg down">lowest</span>':""}</td></tr>`);
      tr.firstChild.textContent = storeName(s); t.appendChild(tr);
    });
    main.appendChild(t);
  }
  main.appendChild(el(`<div class="label"><span>All prices</span></div>`));
  const t = el(`<table></table>`);
  buys.slice().reverse().forEach(x => {
    const tr = el(`<tr><td class="d">${esc(fmtDate(x.date,true))}</td><td></td><td class="r">${esc(peso(x.price))}</td><td style="width:28px;text-align:right"><button class="ghost danger" type="button" aria-label="Delete this price" style="text-decoration:none">✕</button></td></tr>`);
    tr.children[1].textContent = storeName(x.store);
    tr.querySelector("button").onclick = () => { const h = state.history.find(h=>h.id===x.hid); if (h) { h.items = h.items.filter(i=>!(i.pid===p.id && i.price===x.price && i.store===x.store)); state.history = state.history.filter(h=>h.items.length); } touch(); render(); };
    t.appendChild(tr);
  });
  main.appendChild(t);
}

function backupControls(main){
  main.appendChild(el(`<div class="label"><span>Backup</span></div>`));
  const w = el(`<div class="card" style="margin-top:0"><div class="hint" style="margin-top:0">Your list and price history are saved on this phone only. Save a backup file now and then so you don't lose your history if you clear Chrome's data or change phones.</div>
    <div class="form-foot"><button class="primary" type="button" data-a="exp">Save backup file</button>
    <label class="ghost" style="cursor:pointer">Restore from file<input type="file" accept="application/json,.json" hidden></label></div><div class="hint" data-msg></div></div>`);
  const msg = w.querySelector("[data-msg]");
  w.querySelector('[data-a="exp"]').onclick = () => {
    const blob = new Blob([JSON.stringify(state)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `palengke-backup-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); msg.textContent = "Backup file saved to your Downloads.";
  };
  w.querySelector('input[type=file]').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(t => { const d = JSON.parse(t); if (!Array.isArray(d.products) || !Array.isArray(d.history)) throw 0;
      state = d; touch(); render(); }).catch(() => { msg.textContent = "That file isn't a Palengke List backup."; });
  };
  main.appendChild(w);
}

/* ===== shell ===== */
function render(){
  const main = $("main"); const st = main.scrollTop; main.innerHTML = "";
  const inTrip = !!state.trip;
  const showHome = !inTrip && ui.tab !== "prices";
  $("tabs").hidden = !inTrip;
  $("foot").hidden = !inTrip;
  $("tripDate").textContent = inTrip ? "Trip · " + fmtDate(state.trip.date, true) : "";
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab===ui.tab));
  if (showHome) renderHome(main);
  else if (ui.tab==="prices") renderPrices(main);
  else if (ui.tab==="shop") renderShop(main);
  else renderList(main);
  main.scrollTop = st;
  if (inTrip) {
    const items = tItems(), got = items.filter(i=>i.bought);
    $("total").textContent = peso(got.reduce((a,i)=>a+i.bought.price,0));
    $("prog").textContent = `${got.length} of ${items.length} items`;
    $("barFill").style.width = items.length ? (got.length/items.length*100)+"%" : "0%";
  }
  const q = $("q"); if (q && document.activeElement !== q && ui.query) q.focus();
}
function setTab(t){ ui.tab=t; ui.editing=null; ui.confirming=null; if (t!=="prices") ui.product=null; save(); render(); $("main").scrollTop=0; }
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
