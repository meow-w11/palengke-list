<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a4d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>Palengke List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one screen — tabs on top (Plan / Shop), scrolling content, cart total docked at the bottom */
:root{
  --bg:#f3f6f1; --surface:#ffffff; --fg:#17231b; --muted:#5f6f64; --line:#dbe3d8;
  --accent:#1f7a4d; --accent-ink:#ffffff; --soft:#e3efe5; --danger:#b4412f;
  --display:"Familjen Grotesk", "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Roboto Mono", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1712; --surface:#17211a; --fg:#e7efe8; --muted:#93a598; --line:#26332a;
  --accent:#4cc38a; --accent-ink:#06130b; --soft:#1c3226; --danger:#ef7a66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1712; --surface:#17211a; --fg:#e7efe8; --muted:#93a598; --line:#26332a;
  --accent:#4cc38a; --accent-ink:#06130b; --soft:#1c3226; --danger:#ef7a66; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);margin:0}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.pad{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
header{padding-block:14px 8px}
h1{font-size:1.35rem;margin:0 0 10px;letter-spacing:-.01em}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.tabs button{padding:9px 0;border-radius:9px;background:none;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
main{flex:1;overflow-y:auto;min-height:0;padding-block:8px 16px}
input{font:inherit;font-size:16px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;width:100%;box-sizing:border-box}
input.num{font-family:var(--mono);text-align:right}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;color:var(--fg)}
.primary{background:var(--accent);color:var(--accent-ink);border-radius:10px;font-weight:700;padding:10px 14px}
.ghost{background:none;color:var(--accent);font-size:.82rem;padding:6px 0;text-decoration:underline}
.danger{color:var(--danger)}
.row-form{display:grid;grid-template-columns:1fr auto;gap:6px}
.ing-form{display:grid;grid-template-columns:1fr 92px 44px;gap:6px;margin-top:8px}
.ing-form .primary{padding:0;font-size:1.3rem}
.dish{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.dish-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dish h2{font-size:1.05rem;margin:0;overflow-wrap:anywhere;min-width:0}
.dish .count{font-size:.75rem;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.ing{display:grid;grid-template-columns:1fr auto 30px;gap:8px;align-items:center;padding-block:8px;border-bottom:1px dashed var(--line)}
.ing:last-of-type{border-bottom:0}
.ing .nm{min-width:0;overflow-wrap:anywhere}
.amt{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.x{background:none;color:var(--muted);font-size:1rem;padding:4px}
.x:hover{color:var(--danger)}
.note{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:8px 12px;margin-top:8px}
.empty{color:var(--muted);text-align:center;padding:28px 8px;font-size:.9rem;line-height:1.5}
.label{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 4px}
/* shop */
.group-title{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 2px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden}
.item-main{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:12px;width:100%;text-align:left;background:none}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:.85rem}
.item.in .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item.in .nm{color:var(--muted);text-decoration:line-through}
.item .pr{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}
.item:not(.in) .pr{color:var(--muted);font-weight:500;font-size:.8rem}
.editor{display:grid;grid-template-columns:1fr auto;gap:6px;padding:0 12px 12px}
.editor .actions{grid-column:1/-1;display:flex;justify-content:space-between}
.small{font-size:.78rem}
footer{background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px}
footer .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
footer .tot{font-family:var(--mono);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums}
footer .prog{font-family:var(--mono);font-size:.8rem;color:var(--muted);text-align:right}
.bar{height:6px;background:var(--soft);border-radius:4px;margin-top:6px;width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.82rem;margin-top:16px}
</style>
</head>
<body>


<div class="app">
  <header class="pad">
    <h1>Palengke List</h1>
    <div class="tabs" role="tablist">
      <button id="tabPlan" role="tab" type="button" aria-selected="true">Plan</button>
      <button id="tabShop" role="tab" type="button" aria-selected="false">Shop</button>
    </div>
  </header>
  <main class="pad" id="main"></main>
  <footer class="pad">
    <div>
      <div class="lbl">In cart</div>
      <div class="tot" id="total">₱0.00</div>
    </div>
    <div>
      <div class="prog" id="prog">0 of 0 items</div>
      <div class="bar"><i id="barFill" style="width:0%"></i></div>
    </div>
  </footer>
</div>

<script>
const peso = n => "₱" + (Math.round(n*100)/100).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const KEY = "palengke-v2";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const SAMPLE = {sample:true, dishes:[
  {id:"d1",name:"Chicken Adobo",items:[
    {id:"i1",name:"Chicken thighs",amt:"1 kg",price:210,inCart:true},
    {id:"i2",name:"Soy sauce",amt:"1 bottle",price:null,inCart:false},
    {id:"i3",name:"Garlic",amt:"1 head",price:null,inCart:false},
    {id:"i4",name:"Bay leaves",amt:"",price:null,inCart:false}]},
  {id:"d2",name:"Sinigang na Baboy",items:[
    {id:"i5",name:"Pork ribs",amt:"½ kg",price:180,inCart:true},
    {id:"i6",name:"Kangkong",amt:"2 bundles",price:null,inCart:false},
    {id:"i7",name:"Sinigang mix",amt:"1 pack",price:null,inCart:false}]}
]};
let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch(e){ state = null; }
if (!state || !Array.isArray(state.dishes)) state = structuredClone(SAMPLE);
let tab = "plan", editing = null, confirming = null;
try { tab = localStorage.getItem(KEY+"-tab") || "plan"; } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); localStorage.setItem(KEY+"-tab", tab); } catch(e){} };
const touch = () => { state.sample = false; save(); };
const all = () => state.dishes.flatMap(d => d.items);
const $ = id => document.getElementById(id);
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function sampleNote(main){
  if (!state.sample) return;
  const n = el(`<div class="note"><span>These are example dishes.</span><button class="ghost" type="button">Clear examples</button></div>`);
  n.querySelector("button").onclick = () => { state = {sample:false,dishes:[]}; save(); render(); };
  main.appendChild(n);
}

function renderPlan(main){
  sampleNote(main);
  const f = el(`<form class="row-form" style="margin-top:12px" autocomplete="off">
    <input id="dishName" placeholder="Dish to cook, e.g. Pancit" aria-label="Dish name">
    <button class="primary" type="submit">Add dish</button></form>`);
  f.onsubmit = e => { e.preventDefault(); const v = f.querySelector("input").value.trim(); if(!v) return;
    state.dishes.push({id:uid(),name:v,items:[]}); touch(); render();
    const forms = main.querySelectorAll(".ing-form input"); forms[forms.length-1]?.focus(); };
  main.appendChild(f);

  if (!state.dishes.length) main.appendChild(el(`<div class="empty">Add a dish you plan to cook, then list the ingredients you need to buy for it.</div>`));

  state.dishes.forEach(d => {
    const card = el(`<section class="dish">
      <div class="dish-head"><h2></h2><span class="count">${d.items.length} item${d.items.length===1?"":"s"}</span></div>
      <div class="ings"></div>
      <form class="ing-form" autocomplete="off">
        <input placeholder="Ingredient" aria-label="Ingredient for ${esc(d.name)}">
        <input placeholder="Amount" aria-label="Amount">
        <button class="primary" type="submit" aria-label="Add ingredient">+</button>
      </form>
      <button class="ghost danger small" type="button">Remove dish</button>
    </section>`);
    card.querySelector("h2").textContent = d.name;
    const list = card.querySelector(".ings");
    d.items.forEach(it => {
      const r = el(`<div class="ing"><div class="nm"></div><span class="amt"></span><button class="x" type="button" aria-label="Remove">✕</button></div>`);
      r.querySelector(".nm").textContent = it.name;
      r.querySelector(".amt").textContent = it.amt || "";
      r.querySelector(".x").onclick = () => { d.items = d.items.filter(x=>x!==it); touch(); render(); };
      list.appendChild(r);
    });
    const form = card.querySelector(".ing-form");
    form.onsubmit = e => { e.preventDefault();
      const [n,a] = form.querySelectorAll("input"); const name = n.value.trim(); if(!name) return;
      d.items.push({id:uid(),name,amt:a.value.trim(),price:null,inCart:false}); touch(); render();
      const again = main.querySelector(`[data-dish="${d.id}"] input`); again?.focus(); };
    form.dataset.dish = d.id;
    const rm = card.querySelector(".ghost");
    if (confirming === "dish:"+d.id) {
      const c = el(`<div class="confirm"><span>Remove ${esc(d.name)} and its ingredients?</span><button class="primary" type="button">Remove</button><button class="ghost" type="button">Cancel</button></div>`);
      c.querySelector(".primary").onclick = () => { state.dishes = state.dishes.filter(x=>x!==d); confirming=null; touch(); render(); };
      c.querySelector(".ghost").onclick = () => { confirming=null; render(); };
      rm.replaceWith(c);
    } else rm.onclick = () => { confirming = "dish:"+d.id; render(); };
    main.appendChild(card);
  });

  if (all().length) {
    const go = el(`<button class="primary" type="button" style="width:100%;margin-top:16px">Go shopping →</button>`);
    go.onclick = () => setTab("shop");
    main.appendChild(go);
  }
}

function renderShop(main){
  sampleNote(main);
  if (!all().length) { main.appendChild(el(`<div class="empty">Nothing to buy yet. Add dishes and ingredients in Plan first.</div>`)); return; }
  state.dishes.forEach(d => {
    if (!d.items.length) return;
    const g = el(`<div class="group-title"></div>`); g.textContent = d.name; main.appendChild(g);
    d.items.forEach(it => {
      const card = el(`<div class="item${it.inCart?" in":""}">
        <button class="item-main" type="button">
          <span class="box">${it.inCart?"✓":""}</span>
          <span style="min-width:0"><span class="nm"></span><br><span class="amt"></span></span>
          <span class="pr">${it.inCart ? peso(it.price||0) : "tap when in cart"}</span>
        </button></div>`);
      card.querySelector(".nm").textContent = it.name;
      card.querySelector(".amt").textContent = it.amt || "";
      card.querySelector(".item-main").onclick = () => { editing = editing===it.id ? null : it.id; render(); };
      if (editing === it.id) {
        const ed = el(`<form class="editor" autocomplete="off">
          <input class="num" type="number" inputmode="decimal" min="0" step="any" placeholder="Price you paid, ₱" aria-label="Price for ${esc(it.name)}">
          <button class="primary" type="submit">${it.inCart?"Update":"In cart"}</button>
          <div class="actions">
            ${it.inCart ? '<button class="ghost danger" type="button" data-a="out">Take out of cart</button>' : '<span></span>'}
            <button class="ghost" type="button" data-a="cancel">Cancel</button>
          </div></form>`);
        const inp = ed.querySelector("input");
        if (it.inCart && it.price != null) inp.value = it.price;
        ed.onsubmit = e => { e.preventDefault(); it.price = parseFloat(inp.value) || 0; it.inCart = true; editing = null; touch(); render(); };
        ed.querySelector('[data-a="cancel"]').onclick = () => { editing=null; render(); };
        const out = ed.querySelector('[data-a="out"]');
        if (out) out.onclick = () => { it.inCart=false; it.price=null; editing=null; touch(); render(); };
        card.appendChild(ed);
        setTimeout(()=>inp.focus(),0);
      }
      main.appendChild(card);
    });
  });
  // finish trip
  const wrap = el(`<div style="margin-top:20px"></div>`);
  if (confirming === "reset") {
    const c = el(`<div class="confirm"><span>Start a new trip? This unticks everything and clears prices. Your dishes stay.</span><button class="primary" type="button">Start new trip</button><button class="ghost" type="button">Cancel</button></div>`);
    c.querySelector(".primary").onclick = () => { all().forEach(i=>{i.inCart=false;i.price=null}); confirming=null; touch(); render(); };
    c.querySelector(".ghost").onclick = () => { confirming=null; render(); };
    wrap.appendChild(c);
  } else {
    const b = el(`<button class="ghost" type="button">Start a new trip</button>`);
    b.onclick = () => { confirming="reset"; render(); };
    wrap.appendChild(b);
  }
  main.appendChild(wrap);
}

function render(){
  const main = $("main"); const st = main.scrollTop; main.innerHTML = "";
  $("tabPlan").setAttribute("aria-selected", tab==="plan");
  $("tabShop").setAttribute("aria-selected", tab==="shop");
  (tab==="plan" ? renderPlan : renderShop)(main);
  main.scrollTop = st;
  const items = all(), inC = items.filter(i=>i.inCart);
  $("total").textContent = peso(inC.reduce((a,b)=>a+(b.price||0),0));
  $("prog").textContent = `${inC.length} of ${items.length} items`;
  $("barFill").style.width = items.length ? (inC.length/items.length*100)+"%" : "0%";
}
function setTab(t){ tab=t; editing=null; confirming=null; save(); render(); $("main").scrollTop=0; }
$("tabPlan").onclick = () => setTab("plan");
$("tabShop").onclick = () => setTab("shop");
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>

</body>
</html>
